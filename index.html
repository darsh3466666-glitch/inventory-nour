<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>تطبيق إدارة المخزون</title>
<style>
  :root {
    --bg: #f0f4ff; --bg-card: #fff; --bg-soft: #e8eef9; --bg-hover: #dde6f5;
    --ink: #1a2151; --ink-2: #4a5578; --ink-3: #8895b3;
    --line: #d8e0f0; --line-soft: #edf1fa;
    --accent: #5b6ef5; --accent-light: #7d8ffa; --accent-soft: #eaeefc; --accent-ink: #3a47c7;
    --success: #22c55e; --success-bg: #d4f7e0;
    --warning: #f59e0b; --warning-bg: #fef0d0;
    --danger: #ef4444; --danger-bg: #fde0e0;
    --info: #0ea5e9; --info-bg: #d6f0fb;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --sh-xs: 0 1px 3px rgba(30,40,90,.05); --sh-sm: 0 3px 12px rgba(30,40,90,.07); --sh-md: 0 6px 24px rgba(30,40,90,.09); --sh-lg: 0 12px 40px rgba(30,40,90,.12);
    --tr: .28s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"] {
    --bg: #0f172a; --bg-card: #1e293b; --bg-soft: #334155; --bg-hover: #475569;
    --ink: #f1f5f9; --ink-2: #cbd5e1; --ink-3: #94a3b8;
    --line: #334155; --line-soft: #1e293b;
    --accent: #818cf8; --accent-light: #a5b4fc; --accent-soft: #312e81; --accent-ink: #c7d2fe;
    --success: #4ade80; --success-bg: #166534;
    --warning: #fbbf24; --warning-bg: #78350f;
    --danger: #f87171; --danger-bg: #7f1d1d;
    --info: #38bdf8; --info-bg: #0c4a6e;
    --sh-xs: 0 1px 3px rgba(0,0,0,.3); --sh-sm: 0 3px 12px rgba(0,0,0,.4); --sh-md: 0 6px 24px rgba(0,0,0,.5); --sh-lg: 0 12px 40px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: "Cairo","Segoe UI","Tahoma",sans-serif; font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .3s, color .3s; }
  .app { max-width: 1400px; margin: 0 auto; padding: 0 14px 80px; }

  .header { position: sticky; top: 0; z-index: 100; background: rgba(240,244,255,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 12px 14px; border-bottom: 1.5px solid var(--line); margin: 0 -14px 16px; }
  [data-theme="dark"] .header { background: rgba(15,23,42,.92); }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: var(--r-sm); display: grid; place-items: center; color: #fff; box-shadow: var(--sh-sm); flex-shrink: 0; }
  .header-logo svg { width: 22px; height: 22px; }
  .header-text { min-width: 0; }
  .header-text h1 { font-size: 16px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-text p { font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .theme-btn { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--bg-card); border: 1.5px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); transition: var(--tr); flex-shrink: 0; }
  .theme-btn:hover { background: var(--bg-soft); }
  .theme-btn svg { width: 18px; height: 18px; }

  .print-btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border-radius: var(--r-sm); background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--tr); font-family: inherit; flex-shrink: 0; }
  .print-btn:hover { background: var(--accent-ink); }
  .print-btn svg { width: 16px; height: 16px; }

  .live-pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .live-pill.live { background: var(--success-bg); color: var(--success); }
  .live-pill.syncing { background: var(--info-bg); color: var(--info); }
  .live-pill.stale { background: var(--warning-bg); color: var(--warning); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
  .live-pill.live .live-dot { background: var(--success); }
  .live-pill.syncing .live-dot { background: var(--info); }
  .live-pill.stale .live-dot { background: var(--warning); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }

  .update-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--bg-card); border-radius: var(--r-md); margin-bottom: 16px; box-shadow: var(--sh-xs); flex-wrap: wrap; }
  .update-info { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .update-info strong { color: var(--ink); font-weight: 800; }
  .btn-refresh { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border-radius: var(--r-sm); background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--tr); font-family: inherit; }
  .btn-refresh:hover { background: var(--accent-ink); }
  .btn-refresh:active { transform: scale(.96); }
  .btn-refresh svg { width: 16px; height: 16px; }
  .spinning { animation: spin .8s linear infinite; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .kpi-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: var(--bg-card); border-radius: var(--r-lg); padding: 16px 14px; box-shadow: var(--sh-sm); position: relative; overflow: hidden; border: 1.5px solid var(--line-soft); }
  .kpi-card::after { content: ''; position: absolute; top: -20px; inset-inline-end: -20px; width: 70px; height: 70px; border-radius: 50%; opacity: .06; }
  .kpi-card.accent::after { background: var(--accent); }
  .kpi-card.success::after { background: var(--success); }
  .kpi-card.warning::after { background: var(--warning); }
  .kpi-card.info::after { background: var(--info); }
  .kpi-icon { width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; margin-bottom: 8px; }
  .kpi-card.accent .kpi-icon { background: var(--accent-soft); color: var(--accent-ink); }
  .kpi-card.success .kpi-icon { background: var(--success-bg); color: var(--success); }
  .kpi-card.warning .kpi-icon { background: var(--warning-bg); color: var(--warning); }
  .kpi-card.info .kpi-icon { background: var(--info-bg); color: var(--info); }
  .kpi-icon svg { width: 20px; height: 20px; }
  .kpi-label { font-size: 12px; color: var(--ink-2); font-weight: 700; margin-bottom: 3px; }
  .kpi-value { font-size: 26px; font-weight: 900; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi-sub { font-size: 11px; font-weight: 600; margin-top: 4px; color: var(--ink-3); }

  .tabs { display: flex; gap: 5px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 3px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 9px 16px; border-radius: var(--r-md); font-size: 14px; font-weight: 700; color: var(--ink-2); background: var(--bg-card); border: 2px solid var(--line); cursor: pointer; transition: var(--tr); font-family: inherit; white-space: nowrap; }
  .tab:hover { background: var(--bg-soft); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .section-title { font-size: 17px; font-weight: 900; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .section-title .line { flex: 1; height: 2px; background: linear-gradient(90deg, var(--line), transparent); border-radius: 1px; }

  .search-box { position: relative; margin-bottom: 14px; }
  .search-input { width: 100%; padding: 12px 14px 12px 44px; border: 2px solid var(--line); border-radius: var(--r-md); font-size: 16px; font-family: inherit; background: var(--bg-card); color: var(--ink); transition: var(--tr); outline: none; font-weight: 600; }
  .search-input:focus { border-color: var(--accent-light); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search-input::placeholder { color: var(--ink-3); font-weight: 500; }
  .search-icon { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 20px; height: 20px; pointer-events: none; }

  .filters { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 3px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--bg-card); color: var(--ink-2); border: 2px solid var(--line); cursor: pointer; transition: var(--tr); font-family: inherit; white-space: nowrap; }
  .chip:hover { background: var(--bg-soft); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .date-filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .date-chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--bg-card); color: var(--ink-2); border: 2px solid var(--line); cursor: pointer; transition: var(--tr); font-family: inherit; }
  .date-chip:hover { background: var(--bg-soft); }
  .date-chip.active { background: var(--info); color: #fff; border-color: var(--info); }
  .date-range { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .date-input { padding: 7px 10px; border: 2px solid var(--line); border-radius: var(--r-sm); font-size: 13px; font-family: inherit; background: var(--bg-card); color: var(--ink); }
  .date-input:focus { border-color: var(--accent-light); outline: none; }
  .date-btn { padding: 7px 14px; border-radius: var(--r-sm); background: var(--accent); color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .bar-list { display: flex; flex-direction: column; gap: 8px; }
  .group-header { font-size: 14px; font-weight: 900; color: var(--accent-ink); margin: 12px 0 6px; padding: 7px 12px; background: var(--accent-soft); border-radius: var(--r-sm); display: flex; align-items: center; gap: 6px; }
  .group-count { font-size: 11px; font-weight: 800; color: var(--accent); background: var(--bg-card); padding: 2px 8px; border-radius: 999px; }

  .bar-item { background: var(--bg-card); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--sh-xs); border: 1.5px solid var(--line-soft); transition: var(--tr); }
  .bar-item:hover { box-shadow: var(--sh-md); border-color: var(--accent-light); }
  .bar-item-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .bar-item-name { font-size: 15px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
  .bar-item-pct { flex-shrink: 0; font-size: 14px; font-weight: 900; color: var(--accent-ink); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; min-width: 50px; text-align: center; font-variant-numeric: tabular-nums; }
  .bar-track { width: 100%; height: 28px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; margin-bottom: 5px; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .bar-fill.c1 { background: linear-gradient(90deg,#5b6ef5,#7d8ffa); }
  .bar-fill.c2 { background: linear-gradient(90deg,#22c55e,#4ade80); }
  .bar-fill.c3 { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
  .bar-fill.c4 { background: linear-gradient(90deg,#0ea5e9,#38bdf8); }
  .bar-fill.c5 { background: linear-gradient(90deg,#ef4444,#f87171); }
  .bar-fill.c6 { background: linear-gradient(90deg,#8b5cf6,#a78bfa); }
  .bar-fill.c7 { background: linear-gradient(90deg,#ec4899,#f472b6); }
  .bar-fill.c8 { background: linear-gradient(90deg,#14b8a6,#2dd4bf); }
  .bar-fill.c9 { background: linear-gradient(90deg,#f97316,#fb923c); }
  .bar-fill.c10 { background: linear-gradient(90deg,#6366f1,#818cf8); }
  .bar-item-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .bar-item-balance { font-size: 13px; color: var(--ink-2); font-weight: 700; }
  .bar-item-balance strong { font-size: 16px; color: var(--ink); font-weight: 900; font-variant-numeric: tabular-nums; }
  .bar-item-badge { flex-shrink: 0; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .bar-item-badge.ok { background: var(--success-bg); color: var(--success); }
  .bar-item-badge.low { background: var(--warning-bg); color: var(--warning); }
  .bar-item-badge.out { background: var(--danger-bg); color: var(--danger); }

  .cust-item { background: var(--bg-card); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--sh-xs); border: 1.5px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cust-name { font-size: 15px; font-weight: 800; }
  .cust-qty { font-size: 14px; font-weight: 900; color: var(--accent-ink); font-variant-numeric: tabular-nums; background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; }

  .price-item { background: var(--bg-card); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--sh-xs); border: 1.5px solid var(--line-soft); }
  .price-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .price-name { font-size: 15px; font-weight: 800; }
  .price-value { font-size: 20px; font-weight: 900; color: var(--success); font-variant-numeric: tabular-nums; }
  .price-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .price-meta strong { color: var(--ink-2); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: var(--r-md); font-size: 14px; font-weight: 700; box-shadow: var(--sh-lg); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  .skeleton { background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-hover) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--r-md); }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .skeleton-item { height: 70px; margin-bottom: 8px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-3); }
  .empty-state p { font-size: 16px; font-weight: 700; }

  @media (min-width:768px) {
    .app { padding: 0 24px 80px; }
    .header { margin: 0 -24px 16px; padding: 16px 24px; }
    .kpi-grid { grid-template-columns: repeat(4,1fr); gap: 14px; }
    .kpi-value { font-size: 32px; }
    .header-text h1 { font-size: 20px; }
    .header-logo { width: 48px; height: 48px; }
    .header-logo svg { width: 26px; height: 26px; }
    .bar-track { height: 32px; }
    .tab { font-size: 15px; padding: 10px 20px; }
  }
  .footer { text-align: center; padding: 20px 16px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
  .footer strong { color: var(--ink-2); }

  @media print {
    .header, .update-bar, .tabs, .search-box, .filters, .date-filters, .date-range, .btn-refresh, .print-btn, .theme-btn, .live-pill, .footer { display: none !important; }
    body { background: #fff !important; color: #000 !important; font-size: 12px; }
    .app { max-width: 100%; padding: 0; }
    .kpi-grid { grid-template-columns: repeat(4,1fr); }
    .bar-item, .cust-item, .price-item { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    [data-theme] { --bg: #fff; --bg-card: #fff; --ink: #000; --ink-2: #333; --line: #ccc; --line-soft: #eee; --accent-soft: #eef; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-row">
      <div class="header-title">
        <div class="header-logo">
          <img src="logo.png" alt="النور للأعلاف" style="width:100%;height:100%;object-fit:contain;border-radius:var(--r-sm);" />
        </div>
        <div class="header-text">
          <h1>تطبيق إدارة المخزون</h1>
          <p id="printDate">—</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="livePill" class="live-pill live"><span class="live-dot"></span><span id="liveText">مباشر</span></div>
        <button class="print-btn" id="printBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          طباعة
        </button>
        <button class="theme-btn" id="themeBtn">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="update-bar">
    <div class="update-info">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      آخر تحديث: <strong id="lastUpdate">—</strong>
    </div>
    <button class="btn-refresh" id="refreshBtn">
      <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      تحديث
    </button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="balance">الأرصدة</button>
    <button class="tab" data-tab="top">الأكثر سحباً</button>
    <button class="tab" data-tab="least">الأقل سحباً</button>
    <button class="tab" data-tab="customers">العملاء</button>
    <button class="tab" data-tab="prices">الأسعار</button>
    <button class="tab" data-tab="salesrate">معدل المبيعات</button>
  </div>

  <div id="content">
    <div class="skeleton skeleton-item"></div>
    <div class="skeleton skeleton-item"></div>
    <div class="skeleton skeleton-item"></div>
  </div>

  <div class="footer"><img src="logo.png" alt="النور" style="width:48px;height:48px;object-fit:contain;margin-bottom:8px;opacity:0.8;" /><br><strong>النور لتجارة الأعلاف</strong> — تطبيق إدارة المخزون<br>تحديث تلقائي كل دقيقة</div>
</div>
<div class="toast" id="toast"></div>

function filterByDate(items) {
  if (dateFilter === 'all') return items;
  const now = new Date();
  let startDate = null;
  let endDate = null;
  if (dateFilter === 'today') { startDate = new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
  else if (dateFilter === 'week') { startDate = new Date(now); startDate.setDate(startDate.getDate()-7); }
  else if (dateFilter === 'month') { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-1); }
  else if (dateFilter === 'custom' && customDateStart && customDateEnd) {
    startDate = new Date(customDateStart);
    endDate = new Date(customDateEnd); endDate.setDate(endDate.getDate()+1);
  }
  if (!startDate) return items;

  return items.map(item => {
    let filteredQty = 0; let filteredRev = 0; let filteredCount = 0;
    let custMap = {};
    if (item.daily_out) {
      Object.entries(item.daily_out).forEach(([date, qty]) => {
        try {
          const td = new Date(date);
          if (td >= startDate && (!endDate || td < endDate)) {
            filteredQty += qty;
            filteredCount++;
          }
        } catch(e) {}
      });
    }
    // Use daily_customers for customer-level filtering
    if (item.daily_customers) {
      Object.entries(item.daily_customers).forEach(([date, custs]) => {
        try {
          const td = new Date(date);
          if (td >= startDate && (!endDate || td < endDate)) {
            Object.entries(custs).forEach(([name, qty]) => {
              custMap[name] = (custMap[name]||0) + qty;
            });
          }
        } catch(e) {}
      });
    }
    const topCusts = Object.entries(custMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,q])=>({name:n,qty:Math.round(q*1000)/1000}));
    // Estimate revenue proportionally
    const ratio = item.total_out > 0 ? filteredQty / item.total_out : 0;
    filteredRev = item.total_revenue * ratio;
    return { ...item, total_out: Math.round(filteredQty*1000)/1000, total_revenue: Math.round(filteredRev*100)/100, invoice_count: filteredCount, top_customers: topCusts };
  }).filter(i => i.invoice_count > 0);
}

function renderDateFilters() {

  html += '<button class="date-chip '+(dateFilter==='week'?'active':'')+'" data-date="week">آخر أسبوع</button>';
  html += '<button class="date-chip '+(dateFilter==='month'?'active':'')+'" data-date="month">آخر شهر</button>';
  html += '<button class="date-chip '+(dateFilter==='custom'?'active':'')+'" data-date="custom">فترة مخصصة</button>';
  html += '</div>';
  if (dateFilter === 'custom') {
    html += '<div class="date-range"><input type="date" class="date-input" id="dateStart" value="'+(customDateStart||'')+'" /><span>إلى</span><input type="date" class="date-input" id="dateEnd" value="'+(customDateEnd||'')+'" /><button class="date-btn" id="dateApply">تطبيق</button></div>';
  }
  return html;
}

function renderBalanceTab(data) {

  let chips = '<div class="filters"><button class="chip '+(activeFilter==='all'?'active':'')+'" data-filter="all">الكل ('+allItems.length+')</button>';
  if (groups) { Object.keys(groups).sort().forEach(g=>{ const cnt = allItems.filter(i=>(i.group||'')===g).length; if(cnt>0) chips += '<button class="chip '+(activeFilter===g?'active':'')+'" data-filter="'+g+'">'+g+' ('+cnt+')</button>'; }); }

    html += '<div class="group-header">'+cat+' <span class="group-count">'+grouped[cat].length+'</span></div>';

      const bal=parseFloat(item.balance)||0;

      // Logarithmic scale for better visual distribution
      const logP = totalBal>0 ? (Math.log(bal+1)/Math.log(totalBal+1))*100 : 0;

    });
  });
  html += '</div>';
  return html;
}

function renderCustomersTab(data) {
  const allItems = (data.invoices && data.invoices.items) || [];
  if (!allItems.length) return '<div class="empty-state"><p>لا توجد بيانات</p></div>';
  let html = renderDateFilters();
  let filtered = filterByDate(allItems).filter(i=>i.total_out>0);
  if (!filtered.length) return html + '<div class="empty-state"><p>لا توجد بيانات في هذه الفترة</p></div>';

  // Sort items by their top customer's withdrawal amount (descending)
  filtered.sort((a,b) => {
    const aTop = (a.top_customers&&a.top_customers.length>0) ? a.top_customers[0].qty : 0;
    const bTop = (b.top_customers&&b.top_customers.length>0) ? b.top_customers[0].qty : 0;
    return bTop - aTop;
  });

  // Find max single-customer qty for bar scaling
  let maxCustQty = 1;
  filtered.forEach(item => {
    if (item.top_customers && item.top_customers.length > 0) {
      maxCustQty = Math.max(maxCustQty, item.top_customers[0].qty);
    }
  });

  // Aggregate overall top customers
  let custMap = {};
  filtered.forEach(item => {
    if (item.top_customers) {
      item.top_customers.forEach(c => {
        custMap[c.name] = (custMap[c.name]||0) + c.qty;
      });
    }
  });
  const topCusts = Object.entries(custMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

  html += '<div class="section-title">أكثر 10 عملاء سحباً <div class="line"></div></div>';
  html += '<div class="bar-list">';
  const maxAllCust = Math.max(...topCusts.map(c=>c[1]), 1);
  topCusts.forEach((c,i)=>{
    const logP = (Math.log(c[1]+1)/Math.log(maxAllCust+1))*100;
    const bw = Math.max(logP, 8);
    html += '<div class="cust-item"><span class="cust-name">'+(i+1)+'. '+c[0]+'</span><span class="cust-qty">'+fmt(Math.round(c[1]*1000)/1000)+'</span></div>';
  });
  html += '</div>';

  // Items ranked by top customer withdrawal
  html += '<div class="section-title" style="margin-top:20px">ترتيب الأصناف حسب أكثر عميل يسحب منها <div class="line"></div></div>';
  html += '<div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="searchInput" placeholder="ابحث عن صنف..." /></div>';
  html += '<div class="bar-list" id="invList">';
  let ci = 0;
  filtered.forEach((item, idx) => {
    if (!item.top_customers || !item.top_customers.length) return;
    const top = item.top_customers[0];
    const p = (top.qty/maxCustQty)*100;
    const logP = (Math.log(top.qty+1)/Math.log(maxCustQty+1))*100;
    const bw = Math.max(logP, 8);
    html += '<div class="bar-item" data-name="'+(item.name||'').toLowerCase()+'">';
    html += '<div class="bar-item-header"><div><div class="bar-item-name">'+(idx+1)+'. '+item.name+'</div></div><span class="bar-item-pct">'+fmt(top.qty)+'</span></div>';
    html += '<div class="bar-track"><div class="bar-fill '+colorCls(ci++)+'" style="width:'+bw+'%"></div></div>';
    html += '<div class="bar-item-footer"><div class="bar-item-balance">أكثر عميل: <strong>'+top.name+'</strong></div><div class="bar-item-balance">سحب: <strong>'+fmt(top.qty)+'</strong> '+(item.unit||'')+'</div></div>';
    // Show top 3 customers for this item
    const top3 = item.top_customers.slice(0, 3);
    if (top3.length > 1) {
      html += '<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;">';
      top3.forEach((c, i2) => {
        const cPct = maxCustQty > 0 ? (c.qty/maxCustQty)*100 : 0;
        html += '<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600;"><span style="min-width:20px;color:var(--ink-3);">'+(i2+1)+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+c.name+'</span><span style="font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;">'+fmt(c.qty)+'</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderSalesRateTab(data) {
  const allItems = (data.invoices && data.invoices.items) || [];
  if (!allItems.length) return '<div class="empty-state"><p>لا توجد بيانات</p></div>';
  let html = renderDateFilters();
  let filtered = filterByDate(allItems).filter(i=>i.total_out>0);
  if (!filtered.length) return html + '<div class="empty-state"><p>لا توجد بيانات في هذه الفترة</p></div>';

  // Compute daily average sales rate per item
  let startDate = null, endDate = null;
  const now = new Date();
  if (dateFilter === 'today') { startDate = new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
  else if (dateFilter === 'week') { startDate = new Date(now); startDate.setDate(startDate.getDate()-7); }
  else if (dateFilter === 'month') { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-1); }
  else if (dateFilter === 'custom' && customDateStart && customDateEnd) { startDate = new Date(customDateStart); endDate = new Date(customDateEnd); }
  else { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-12); }
  if (!endDate) endDate = now;
  const dayCount = Math.max(Math.ceil((endDate - startDate) / (1000*60*60*24)), 1);

  // Compute sales rate (qty per day) for each item
  // Count actual days with sales in the filtered period
  const rateData = filtered.map(item => {
    let activeDays = 0;
    if (item.daily_out) {
      Object.entries(item.daily_out).forEach(([date, qty]) => {
        try {
          const td = new Date(date);
          if (td >= startDate && (!endDate || td < endDate) && qty > 0) {
            activeDays++;
          }
        } catch(e) {}
      });
    }
    const divisor = activeDays > 0 ? activeDays : dayCount;
    const ratePerDay = item.total_out / divisor;
    return { ...item, rate_per_day: Math.round(ratePerDay*1000)/1000, active_days: activeDays };
  }).sort((a,b) => b.rate_per_day - a.rate_per_day);

  const maxRate = Math.max(...rateData.map(i=>i.rate_per_day), 0.001);

  // Item selector dropdown
  html += '<div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="searchInput" placeholder="ابحث عن صنف لعرض رسم بياني مفصل..." /></div>';

  // Summary chart - bar chart of all items' rates
  html += '<div class="section-title">معدل المبيعات اليومي لكل صنف <div class="line"></div></div>';
  html += '<div class="bar-list" id="invList">';
  let ci = 0;
  rateData.forEach(item => {
    const p = (item.rate_per_day / maxRate) * 100;
    const logP = (Math.log(item.rate_per_day+1)/Math.log(maxRate+1))*100;
    const bw = Math.max(logP, 8);
    html += '<div class="bar-item" data-name="'+(item.name||'').toLowerCase()+'" data-item-index="'+ci+'">';
    html += '<div class="bar-item-header"><div><div class="bar-item-name">'+item.name+'</div></div><span class="bar-item-pct">'+fmt(item.rate_per_day)+'/يوم</span></div>';
    html += '<div class="bar-track"><div class="bar-fill '+colorCls(ci++)+'" style="width:'+bw+'%"></div></div>';
    html += '<div class="bar-item-footer"><div class="bar-item-balance">المعدل: <strong>'+fmt(item.rate_per_day)+'</strong> '+(item.unit||'')+'/يوم</div><div class="bar-item-balance">إجمالي: <strong>'+fmt(item.total_out)+'</strong> '+(item.unit||'')+' ('+item.active_days+' يوم)</div></div>';
    html += '</div>';
  });
  html += '</div>';

  // Detail chart for selected item (clickable)
  html += '<div id="detailChart" style="margin-top:20px;"></div>';

  return html;
}

function renderItemDetailChart(item, dayCount) {
  if (!item || !item.daily_out) return '';
  const entries = Object.entries(item.daily_out).sort((a,b) => a[0].localeCompare(b[0]));
  if (!entries.length) return '';

  const now = new Date();
  let startDate = null, endDate = null;
  if (dateFilter === 'today') { startDate = new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
  else if (dateFilter === 'week') { startDate = new Date(now); startDate.setDate(startDate.getDate()-7); }
  else if (dateFilter === 'month') { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-1); }
  else if (dateFilter === 'custom' && customDateStart && customDateEnd) { startDate = new Date(customDateStart); endDate = new Date(customDateEnd); }
  else { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-12); }
  if (!endDate) endDate = now;

  const filtered = entries.filter(([date, qty]) => {
    try { const td = new Date(date); return td >= startDate && td <= endDate; } catch(e) { return false; }
  });
  if (!filtered.length) return '<div class="empty-state"><p>لا توجد بيانات في هذه الفترة</p></div>';

  // Aggregate by month
  const monthlyMap = {};
  filtered.forEach(([date, qty]) => {
    const monthKey = date.substring(0, 7); // YYYY-MM
    if (!monthlyMap[monthKey]) monthlyMap[monthKey] = { total: 0, days: 0 };
    monthlyMap[monthKey].total += qty;
    monthlyMap[monthKey].days++;
  });
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const monthlyData = Object.entries(monthlyMap).sort((a,b) => a[0].localeCompare(b[0])).map(([month, d]) => {
    const [yr, mo] = month.split('-');
    const label = monthNames[parseInt(mo)-1] + ' ' + yr;
    return { month, label, total: Math.round(d.total*1000)/1000, days: d.days, avg: Math.round((d.total/d.days)*1000)/1000 };
  });

  // Build vertical bar chart (monthly)
  const maxQty = Math.max(...monthlyData.map(d=>d.total), 1);
  const barW = 60, barGap = 16, padL = 60, padR = 16, padT = 24, padB = 50;
  const chartW = Math.max(monthlyData.length * (barW + barGap) + padL + padR, 400);
  const chartH = 300;
  const maxBarH = chartH - padT - padB;

  let svg = '<div style="background:var(--bg-card);border-radius:var(--r-md);padding:18px 16px;box-shadow:var(--sh-sm);border:1.5px solid var(--line-soft);margin-bottom:14px;">';
  svg += '<div style="font-size:17px;font-weight:800;margin-bottom:4px;">'+item.name+'</div>';
  svg += '<div style="font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:14px;">رسم بياني شهري لمعدل المبيعات</div>';
  svg += '<div style="overflow-x:auto;"><svg style="min-width:'+(chartW-20)+'px;height:'+chartH+'px;display:block;" viewBox="0 0 '+chartW+' '+chartH+'" preserveAspectRatio="xMidYMid meet">';

  // Y-axis grid
  for (let g = 0; g <= 5; g++) {
    const gy = padT + maxBarH * g / 5;
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(chartW-padR)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3" />';
    const labelVal = maxQty * (1 - g/5);
    svg += '<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="11" fill="var(--ink-3)" font-weight="600">'+fmt(Math.round(labelVal*10)/10)+'</text>';
  }

  // Bars
  const colors = ['#5b6ef5','#22c55e','#f59e0b','#0ea5e9','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#10b981','#f43f5e'];
  monthlyData.forEach((d, i) => {
    const x = padL + i * (barW + barGap);
    const h = (d.total / maxQty) * maxBarH;
    const y = padT + maxBarH - h;
    const color = colors[i % colors.length];
    // Bar with gradient
    svg += '<defs><linearGradient id="bg'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="1"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0.6"/></linearGradient></defs>';
    svg += '<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+barW+'" height="'+h.toFixed(1)+'" rx="6" fill="url(#bg'+i+')" />';
    // Value on top
    svg += '<text x="'+(x + barW/2)+'" y="'+(y - 6)+'" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">'+fmt(d.total)+'</text>';
    // Month label
n    svg += '<text x="'+(x + barW/2)+'" y="'+(chartH - padB + 18)+'" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-weight="700">'+d.label+'</text>';
    // Days count
    svg += '<text x="'+(x + barW/2)+'" y="'+(chartH - padB + 34)+'" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-weight="500">'+d.days+' يوم</text>';
  });

  // X-axis line
  svg += '<line x1="'+padL+'" y1="'+(padT+maxBarH)+'" x2="'+(chartW-padR)+'" y2="'+(padT+maxBarH)+'" stroke="var(--line)" stroke-width="1.5" />';
  svg += '</svg></div>';

  // Stats summary
  const totalQty = monthlyData.reduce((s,d)=>s+d.total,0);
  const totalDays = monthlyData.reduce((s,d)=>s+d.days,0);
  const avgMonthly = totalQty / monthlyData.length;
  const avgDailyOverall = totalDays > 0 ? totalQty / totalDays : 0;
  const maxMonth = monthlyData.reduce((max, d) => d.total > max.total ? d : max, monthlyData[0]);
  const minMonth = monthlyData.reduce((min, d) => d.total < min.total ? d : min, monthlyData[0]);

  svg += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink-2);font-weight:600;">';
  svg += '<span>إجمالي: <strong style="color:var(--ink);">'+fmt(Math.round(totalQty*1000)/1000)+'</strong> '+(item.unit||'')+'</span>';
  svg += '<span>متوسط شهري: <strong style="color:var(--ink);">'+fmt(Math.round(avgMonthly*1000)/1000)+'</strong> '+(item.unit||'')+'</span>';
  svg += '<span>المعدل اليومي: <strong style="color:var(--ink);">'+fmt(Math.round(avgDailyOverall*1000)/1000)+'</strong> '+(item.unit||'')+'/يوم</span>';
  svg += '<span>أعلى شهر: <strong style="color:var(--success);">'+fmt(maxMonth.total)+'</strong> ('+maxMonth.label+')</span>';
  svg += '<span>أقل شهر: <strong style="color:var(--danger);">'+fmt(minMonth.total)+'</strong> ('+minMonth.label+')</span>';
  svg += '</div>';

  // Data table
  svg += '<div style="margin-top:16px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);">';
  svg += '<table style="width:100%;border-collapse:collapse;font-size:14px;">';
  svg += '<thead><tr style="background:var(--bg-soft);"><th style="padding:10px 14px;text-align:right;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">الشهر</th><th style="padding:10px 14px;text-align:left;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">الإجمالي ('+(item.unit||'')+')</th><th style="padding:10px 14px;text-align:left;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">المعدل اليومي</th><th style="padding:10px 14px;text-align:left;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">الأيام</th></tr></thead>';
  svg += '<tbody>';
  monthlyData.slice().reverse().forEach((d, i) => {
    const rowBg = i % 2 === 0 ? 'transparent' : 'var(--bg-soft)';
    svg += '<tr style="background:'+rowBg+';"><td style="padding:9px 14px;text-align:right;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line-soft);">'+d.label+'</td><td style="padding:9px 14px;text-align:left;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line-soft);">'+fmt(d.total)+'</td><td style="padding:9px 14px;text-align:left;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line-soft);">'+fmt(d.avg)+'</td><td style="padding:9px 14px;text-align:left;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line-soft);">'+d.days+'</td></tr>';
  });
  // Summary row
  svg += '<tr style="background:var(--accent-soft);"><td style="padding:10px 14px;text-align:right;font-weight:900;color:var(--accent-ink);border-top:2px solid var(--accent);">المتوسط الشهري</td><td style="padding:10px 14px;text-align:left;font-weight:900;color:var(--accent-ink);font-variant-numeric:tabular-nums;border-top:2px solid var(--accent);">'+fmt(Math.round(avgMonthly*1000)/1000)+'</td><td style="padding:10px 14px;border-top:2px solid var(--accent);"></td><td style="padding:10px 14px;border-top:2px solid var(--accent);"></td></tr>';
  svg += '</tbody></table></div>';

  svg += '</div>';
  return svg;
}

    html += '<div class="price-item" data-name="'+(item.name||'').toLowerCase()+'"><div class="price-item-header"><div><div class="price-name">'+item.name+'</div></div><div class="price-value">'+fmt(item.latest_price)+'</div></div><div class="price-meta"><span>متوسط: <strong>'+fmt(item.avg_price)+'</strong> جنيه</span><span>مسحوب: <strong>'+fmt(item.total_out)+'</strong> '+(item.unit||'')+'</span><span>فواتير: <strong>'+item.invoice_count+'</strong></span></div></div>';
  });
  html += '</div>';
  return html;
}

function setPill(s,t) { document.getElementById('livePill').className='live-pill '+s; document.getElementById('liveText').textContent=t; }
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

function renderContent() {
  const c = document.getElementById('content');
  if (!lastData) { c.innerHTML = '<div class="skeleton skeleton-item"></div><div class="skeleton skeleton-item"></div>'; return; }
  let html = renderKPIs(lastData);
  const titles = {balance:'نسبة كل صنف من إجمالي المخزون',top:'الأصناف الأكثر سحباً',least:'الأصناف الأقل سحباً',customers:'تحليل العملاء',prices:'أسعار الأصناف',salesrate:'معدل المبيعات اليومي'};
  html += '<div class="section-title">'+(titles[activeTab]||'')+'<div class="line"></div></div>';
  if (activeTab==='balance') html += renderBalanceTab(lastData);
  else if (activeTab==='top') html += renderWithdrawnTab(lastData, true);
  else if (activeTab==='least') html += renderWithdrawnTab(lastData, false);
  else if (activeTab==='customers') html += renderCustomersTab(lastData);
  else if (activeTab==='prices') html += renderPricesTab(lastData);
  else if (activeTab==='salesrate') html += renderSalesRateTab(lastData);
  c.innerHTML = html;

  const si = document.getElementById('searchInput');
  if (si) { si.addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); document.querySelectorAll('#invList .bar-item, #invList .price-item, #invList .cust-item').forEach(it=>{ it.style.display=(it.dataset.name||'').includes(q)?'':'none'; }); }); }
  document.querySelectorAll('.chip').forEach(ch=>{ ch.addEventListener('click',()=>{ activeFilter=ch.dataset.filter; renderContent(); }); });
  document.querySelectorAll('.date-chip').forEach(ch=>{ ch.addEventListener('click',()=>{ dateFilter=ch.dataset.date; renderContent(); }); });
  const dateApply = document.getElementById('dateApply');
  if (dateApply) { dateApply.addEventListener('click',()=>{ customDateStart=document.getElementById('dateStart').value; customDateEnd=document.getElementById('dateEnd').value; renderContent(); }); }

  // Click on item in salesrate tab to show detail chart
  if (activeTab === 'salesrate') {
    const allItems = (lastData.invoices && lastData.invoices.items) || [];
    document.querySelectorAll('#invList .bar-item').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        const name = el.dataset.name || '';
        const item = allItems.find(i => (i.name||'').toLowerCase() === name);
        const detail = document.getElementById('detailChart');
        if (item && detail) {
          detail.innerHTML = renderItemDetailChart(item, 30);
          detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    });
    // Also react to search: if exact match, show chart
    const si2 = document.getElementById('searchInput');
    if (si2) {
      si2.addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        if (q.length >= 2) {
          const matched = allItems.find(i => (i.name||'').toLowerCase().includes(q));
          if (matched) {
            const detail = document.getElementById('detailChart');
            if (detail) detail.innerHTML = renderItemDetailChart(matched, 30);
          }
        }
      });
    }
  }
}

function loadData() {
  if (typeof EMBEDDED_DATA!=='undefined' && EMBEDDED_DATA) return Promise.resolve(EMBEDDED_DATA);
  return fetch('inventory_data.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);
}

async function refresh(silent) {
  if (!silent) { setPill('syncing','جاري التحديث...'); document.getElementById('refreshIcon').classList.add('spinning'); }
  const data = await loadData();
  if (!data) { setPill('stale','تعذّر التحديث'); if(!silent){document.getElementById('refreshIcon').classList.remove('spinning');toast('تعذّر تحديث البيانات');} return; }
  lastData = data;
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  if (data.print_date) document.getElementById('printDate').textContent = 'تاريخ التقرير: '+data.print_date;
  setPill('live','مباشر');
  if (!silent) { document.getElementById('refreshIcon').classList.remove('spinning'); toast('تم تحديث البيانات'); }
  renderContent();
}

document.getElementById('refreshBtn').addEventListener('click',()=>refresh(false));
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.querySelectorAll('.tab').forEach(t=>{ t.addEventListener('click',()=>{ activeTab=t.dataset.tab; activeFilter='all'; dateFilter='all'; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t)); renderContent(); }); });

refresh(true).then(()=>{ setInterval(()=>{ fetch('inventory_data.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{ if(d){lastData=d;document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});setPill('live','مباشر');renderContent();} }).catch(()=>{}); },60000); });
</script>
</body>
