function renderSalesRateTab(data) {
  const allItems = (data.invoices && data.invoices.items) || [];
  if (!allItems.length) return '<div class="empty-state"><p>لا توجد بيانات</p></div>';
  let html = renderDateFilters();
  let filtered = filterByDate(allItems).filter(i=>i.total_out>0);
  if (!filtered.length) return html + '<div class="empty-state"><p>لا توجد بيانات في هذه الفترة</p></div>';

  // Compute daily average sales rate per item
  const { startDate, endDate } = getFilterDateRange(allItems);
  const dayCount = Math.max(Math.ceil((endDate - startDate) / (1000*60*60*24)), 1);

  // Compute sales rate (qty per day) for each item
  // Count actual days with sales in the filtered period
  const rateData = filtered.map(item => {
    let activeDays = 0;
    if (item.daily_out) {
      Object.entries(item.daily_out).forEach(([date, qty]) => {
        try {
          const td = new Date(date);
          if (td >= startDate && (!endDate || td < endDate) && qty > 0) {
            activeDays++;
          }
        } catch(e) {}
      });
    }
    const divisor = activeDays > 0 ? activeDays : dayCount;
    const ratePerDay = item.total_out / divisor;
    return { ...item, rate_per_day: Math.round(ratePerDay*1000)/1000, active_days: activeDays };
  }).sort((a,b) => {
    if (salesSort === 'top') return b.total_out - a.total_out;
    if (salesSort === 'least') return a.total_out - b.total_out;
    return b.rate_per_day - a.rate_per_day;
  });

  const maxRate = Math.max(...rateData.map(i=>i.rate_per_day), 0.001);

  // Sort toggle
  html += '<div class="filters" style="margin-top:10px;">';
  html += '<button class="chip sort-chip '+(salesSort==='rate'?'active':'')+'" data-sort="rate">الأعلى معدل</button>';
  html += '<button class="chip sort-chip '+(salesSort==='top'?'active':'')+'" data-sort="top">الأكثر سحباً</button>';
  html += '<button class="chip sort-chip '+(salesSort==='least'?'active':'')+'" data-sort="least">الأقل سحباً</button>';
  html += '</div>';

  // Item selector dropdown
  html += '<div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="searchInput" placeholder="ابحث عن صنف لعرض رسم بياني مفصل..." /></div>';

  // Summary chart - bar chart of all items' rates
  html += '<div class="section-title">إحصائيات الأصناف <div class="line"></div></div>';
  html += '<div class="bar-list" id="invList">';
  let ci = 0;
  rateData.forEach((item, idx) => {
    let p, logP, bw;
    if (salesSort === 'rate') {
      p = (item.rate_per_day / maxRate) * 100;
      logP = (Math.log(item.rate_per_day+1)/Math.log(maxRate+1))*100;
      bw = Math.max(logP, 8);
    } else {
      const maxOut = Math.max(...rateData.map(i=>i.total_out), 1);
      p = (item.total_out / maxOut) * 100;
      logP = maxOut>0 ? (Math.log(item.total_out+1)/Math.log(maxOut+1))*100 : 0;
      bw = Math.max(logP, 8);
    }
    
    html += '<div class="bar-item" data-name="'+(item.name||'').toLowerCase()+'" data-item-index="'+ci+'">';
    html += '<div class="bar-item-header"><div><div class="bar-item-name">'+(idx+1)+'. '+item.name+'</div></div></div>';
    html += '<div class="bar-track"><div class="bar-fill '+colorCls(ci++)+'" style="width:'+bw+'%"></div></div>';
    html += '<div class="bar-item-footer"><div class="bar-item-balance">مسحوب: <strong>'+fmt(item.total_out)+'</strong> '+(item.unit||'')+' ('+item.active_days+' يوم)</div><div class="bar-item-balance">إجمالي: <strong>'+fmt(item.total_revenue)+'</strong> جنيه</div><div class="bar-item-balance">المعدل: <strong>'+fmt(item.rate_per_day)+'</strong>/يوم</div></div>';
    html += '</div>';
  });
  html += '</div>';

  // Detail chart for selected item (clickable)
  html += '<div id="detailChart" style="margin-top:20px;"></div>';

  return html;
}

function renderItemDetailChart(item, dayCount) {
  if (!item || !item.daily_out) return '';
  const entries = Object.entries(item.daily_out).sort((a,b) => a[0].localeCompare(b[0]));
  if (!entries.length) return '';

  const { startDate, endDate } = getFilterDateRange([item]);

  const filtered = entries.filter(([date, qty]) => {
    try { const td = new Date(date); return td >= startDate && td <= endDate; } catch(e) { return false; }
  });
  if (!filtered.length) return '<div class="empty-state"><p>لا توجد بيانات في هذه الفترة</p></div>';

  // Aggregate by month
  const monthlyMap = {};
  filtered.forEach(([date, qty]) => {
    const monthKey = date.substring(0, 7); // YYYY-MM
    if (!monthlyMap[monthKey]) monthlyMap[monthKey] = { total: 0, days: 0 };
    monthlyMap[monthKey].total += qty;
    monthlyMap[monthKey].days++;
  });
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const monthlyData = Object.entries(monthlyMap).sort((a,b) => a[0].localeCompare(b[0])).map(([month, d]) => {
    const [yr, mo] = month.split('-');
    const label = monthNames[parseInt(mo)-1] + ' ' + yr;
    return { month, label, total: Math.round(d.total*1000)/1000, days: d.days, avg: Math.round((d.total/d.days)*1000)/1000 };
  });

  // Build vertical bar chart (monthly)
  const maxQty = Math.max(...monthlyData.map(d=>d.total), 1);
  const barW = 60, barGap = 16, padL = 85, padR = 16, padT = 24, padB = 50;
  const chartW = Math.max(monthlyData.length * (barW + barGap) + padL + padR, 400);
  const chartH = 300;
  const maxBarH = chartH - padT - padB;

  let svg = '<div style="position:relative;background:var(--bg-card);border-radius:var(--r-md);padding:18px 16px;box-shadow:var(--sh-sm);border:1.5px solid var(--line-soft);margin-bottom:14px;">';
  svg += '<div id="closeChartBtn" style="position:absolute;top:15px;left:15px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--line-soft);border-radius:50%;cursor:pointer;color:var(--ink);font-weight:bold;font-size:20px;transition:0.2s;" onmouseover="this.style.background=\'var(--danger)\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'var(--line-soft)\';this.style.color=\'var(--ink)\'">&times;</div>';
  svg += '<div style="font-size:17px;font-weight:800;margin-bottom:4px;padding-left:40px;">'+item.name+'</div>';
  svg += '<div style="font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:14px;padding-left:40px;">رسم بياني شهري لمعدل المبيعات</div>';
  svg += '<div style="overflow-x:auto;" dir="ltr"><svg style="min-width:'+(chartW-20)+'px;height:'+chartH+'px;display:block;" viewBox="0 0 '+chartW+' '+chartH+'" preserveAspectRatio="xMidYMid meet">';

  // Y-axis grid
  for (let g = 0; g <= 5; g++) {
    const gy = padT + maxBarH * g / 5;
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(chartW-padR)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3" />';
    const labelVal = maxQty * (1 - g/5);
    svg += '<text x="'+(padL-10)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)" font-weight="600">'+fmt(Math.round(labelVal*10)/10)+'</text>';
  }

  // Bars
  const colors = ['#5b6ef5','#22c55e','#f59e0b','#0ea5e9','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#10b981','#f43f5e'];
  monthlyData.forEach((d, i) => {
    const x = padL + i * (barW + barGap);
    const h = (d.total / maxQty) * maxBarH;
    const y = padT + maxBarH - h;
    const color = colors[i % colors.length];
    // Bar with gradient
    svg += '<defs><linearGradient id="bg'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="1"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0.6"/></linearGradient></defs>';
    svg += '<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+barW+'" height="'+h.toFixed(1)+'" rx="6" fill="url(#bg'+i+')" />';
    // Value on top
    svg += '<text x="'+(x + barW/2)+'" y="'+(y - 6)+'" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">'+fmt(d.total)+'</text>';
    // Month label
    svg += '<text x="'+(x + barW/2)+'" y="'+(chartH - padB + 18)+'" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-weight="700">'+d.label+'</text>';
    // Days count
    svg += '<text x="'+(x + barW/2)+'" y="'+(chartH - padB + 34)+'" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-weight="500">'+d.days+' يوم</text>';
  });

  // X-axis line
  svg += '<line x1="'+padL+'" y1="'+(padT+maxBarH)+'" x2="'+(chartW-padR)+'" y2="'+(padT+maxBarH)+'" stroke="var(--line)" stroke-width="1.5" />';
  svg += '</svg></div>';

  // Stats summary
  const totalQty = monthlyData.reduce((s,d)=>s+d.total,0);
  const totalDays = monthlyData.reduce((s,d)=>s+d.days,0);
  const avgMonthly = totalQty / monthlyData.length;
  const avgDailyOverall = totalDays > 0 ? totalQty / totalDays : 0;
  const maxMonth = monthlyData.reduce((max, d) => d.total > max.total ? d : max, monthlyData[0]);
  const minMonth = monthlyData.reduce((min, d) => d.total < min.total ? d : min, monthlyData[0]);

  svg += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink-2);font-weight:600;">';
  svg += '<span>إجمالي: <strong style="color:var(--ink);">'+fmt(Math.round(totalQty*1000)/1000)+'</strong> '+(item.unit||'')+'</span>';
  svg += '<span>متوسط شهري: <strong style="color:var(--ink);">'+fmt(Math.round(avgMonthly*1000)/1000)+'</strong> '+(item.unit||'')+'</span>';
  svg += '<span>المعدل اليومي: <strong style="color:var(--ink);">'+fmt(Math.round(avgDailyOverall*1000)/1000)+'</strong> '+(item.unit||'')+'/يوم</span>';
  svg += '<span>أعلى شهر: <strong style="color:var(--success);">'+fmt(maxMonth.total)+'</strong> ('+maxMonth.label+')</span>';
  svg += '<span>أقل شهر: <strong style="color:var(--danger);">'+fmt(minMonth.total)+'</strong> ('+minMonth.label+')</span>';
  svg += '</div>';

  // Data table
  svg += '<div style="margin-top:16px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);">';
  svg += '<table style="width:100%;border-collapse:collapse;font-size:14px;">';
  svg += '<thead><tr style="background:var(--bg-soft);"><th style="padding:10px 14px;text-align:right;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">الشهر</th><th style="padding:10px 14px;text-align:left;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">الإجمالي ('+(item.unit||'')+')</th><th style="padding:10px 14px;text-align:left;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">المعدل اليومي</th><th style="padding:10px 14px;text-align:left;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);">الأيام</th></tr></thead>';
  svg += '<tbody>';
  monthlyData.slice().reverse().forEach((d, i) => {
    const rowBg = i % 2 === 0 ? 'transparent' : 'var(--bg-soft)';
    svg += '<tr style="background:'+rowBg+';"><td style="padding:9px 14px;text-align:right;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line-soft);">'+d.label+'</td><td style="padding:9px 14px;text-align:left;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line-soft);">'+fmt(d.total)+'</td><td style="padding:9px 14px;text-align:left;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line-soft);">'+fmt(d.avg)+'</td><td style="padding:9px 14px;text-align:left;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line-soft);">'+d.days+'</td></tr>';
  });
  // Summary row
  svg += '<tr style="background:var(--accent-soft);"><td style="padding:10px 14px;text-align:right;font-weight:900;color:var(--accent-ink);border-top:2px solid var(--accent);">المتوسط الشهري</td><td style="padding:10px 14px;text-align:left;font-weight:900;color:var(--accent-ink);font-variant-numeric:tabular-nums;border-top:2px solid var(--accent);">'+fmt(Math.round(avgMonthly*1000)/1000)+'</td><td style="padding:10px 14px;border-top:2px solid var(--accent);"></td><td style="padding:10px 14px;border-top:2px solid var(--accent);"></td></tr>';
  svg += '</tbody></table></div>';

  svg += '</div>';
  return svg;
}

/* =========================================================
   محضر الجرد والتسوية المخزنية الرسمي (Reconciliation Minutes)
   ========================================================= */

function getReconciliationBatches(data) {
  const rec = (data && data.reconciliations) || {};
  const items = rec.items || [];
  const batches = {};

  items.forEach(item => {
    const hist = item.history || [];
    hist.forEach((h, hIdx) => {
      const fullDate = (h.date || '').replace('T', ' ');
      const dateKey = fullDate.substring(0, 10);
      if (!dateKey) return;
      if (!batches[dateKey]) {
        batches[dateKey] = {
          date: dateKey,
          latestTimestamp: fullDate,
          items: [],
          sandNumbers: new Set(),
          users: new Set()
        };
      }
      const b = batches[dateKey];
      if (fullDate > b.latestTimestamp) {
        b.latestTimestamp = fullDate;
      }
      if (h.bayan) b.sandNumbers.add(h.bayan);
      if (h.user) b.users.add(h.user);

      const balAfter = h.balance != null ? h.balance : 0;
      const rawDiff = h.raw_diff != null ? h.raw_diff : 0;
      const balBefore = balAfter - rawDiff;

      // Extract previous audit record for this item (if any)
      const prevRecord = hist[hIdx + 1];
      let prevRawDiff = null;
      let prevDiff = null;
      let prevDate = '';
      let prevKgPerTon = 0;
      if (prevRecord) {
        prevRawDiff = prevRecord.raw_diff != null ? prevRecord.raw_diff : 0;
        prevDiff = Math.abs(prevRecord.diff != null ? prevRecord.diff : prevRawDiff);
        prevDate = (prevRecord.date || '').replace('T', ' ').substring(0, 10);
        prevKgPerTon = prevRecord.kg_per_ton || 0;
      }

      b.items.push({
        code: item.code,
        name: item.name,
        unit: item.unit || 'كيلو',
        category: item.category || '',
        is_feed: item.is_feed || item.unit === 'كيلو',
        is_cotton_based: item.is_cotton_based || false,
        full_date: fullDate,
        bayan: h.bayan || '',
        user: h.user || '',
        status: h.status || '',
        diff: Math.abs(h.diff != null ? h.diff : rawDiff),
        raw_diff: rawDiff,
        balance_after: balAfter,
        balance_before: balBefore,
        cycle_wared: h.cycle_wared || 0,
        cycle_sader: h.cycle_sader || 0,
        kg_per_ton: h.kg_per_ton || 0,
        shortage_pct: h.shortage_pct || 0,
        prev_raw_diff: prevRawDiff,
        prev_diff: prevDiff,
        prev_audit_date: prevDate,
        prev_kg_per_ton: prevKgPerTon
      });
    });
  });

  return batches;
}

let currentMinutesDate = null;

function openMinutesModal(targetDate) {
  if (!lastData) return;
  const batches = getReconciliationBatches(lastData);
  const sortedDates = Object.keys(batches).sort().reverse();
  if (!sortedDates.length) {
    toast('لا توجد جلسات جرد مسجلة');
    return;
  }

  if (!targetDate || !batches[targetDate]) {
    targetDate = sortedDates[0];
  }
  currentMinutesDate = targetDate;

  const select = document.getElementById('minutesBatchSelect');
  if (select) {
    let selectHtml = '';
    sortedDates.forEach((dt, idx) => {
      const b = batches[dt];
      const count = b.items.length;
      const sands = Array.from(b.sandNumbers).join(', ');
      const isLatest = idx === 0 ? ' [الأحدث ⭐]' : '';
      const label = 'جلسة ' + dt + ' (' + count + ' ' + (count > 1 ? 'أصناف' : 'صنف') + (sands ? ' - ' + sands : '') + ')' + isLatest;
      selectHtml += '<option value="' + dt + '" ' + (dt === targetDate ? 'selected' : '') + '>' + label + '</option>';
    });
    select.innerHTML = selectHtml;
    select.value = targetDate;
  }

  renderMinutesDocument(targetDate);

  const modal = document.getElementById('minutesModal');
  if (modal) {
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
}

function closeMinutesModal() {
  const modal = document.getElementById('minutesModal');
  if (modal) {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
}

function handleModalBackdropClick(event) {
  if (event.target && event.target.id === 'minutesModal') {
    closeMinutesModal();
  }
}

function onMinutesBatchChange(date) {
  currentMinutesDate = date;
  renderMinutesDocument(date);
}

function printMinutes() {
  document.body.classList.add('printing-minutes');
  window.print();
}

window.addEventListener('beforeprint', function() {
  const modal = document.getElementById('minutesModal');
  if (modal && modal.style.display !== 'none') {
    document.body.classList.add('printing-minutes');
  }
});

window.addEventListener('afterprint', function() {
  document.body.classList.remove('printing-minutes');
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeMinutesModal();
  }
});

function renderMinutesDocument(targetDate) {
  const paper = document.getElementById('minutesPaperContent');
  if (!paper || !lastData) return;

  const batches = getReconciliationBatches(lastData);
  const batch = batches[targetDate];
  if (!batch || !batch.items.length) {
    paper.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">لا توجد بيانات مسجلة لجلسة الجرد المحددة (' + targetDate + ')</div>';
    return;
  }

  const items = batch.items.slice().sort((a, b) => {
    if (a.raw_diff < 0 && b.raw_diff >= 0) return -1;
    if (a.raw_diff >= 0 && b.raw_diff < 0) return 1;
    if (a.is_feed && b.is_feed) return (b.kg_per_ton || 0) - (a.kg_per_ton || 0);
    return Math.abs(b.raw_diff) - Math.abs(a.raw_diff);
  });

  const totalItems = items.length;
  const shortageItems = items.filter(i => i.raw_diff < 0);
  const surplusItems = items.filter(i => i.raw_diff > 0);

  const shortageKg = shortageItems.filter(i => i.is_feed).reduce((s, i) => s + Math.abs(i.raw_diff), 0);
  const shortagePieces = shortageItems.filter(i => !i.is_feed).reduce((s, i) => s + Math.abs(i.raw_diff), 0);
  const surplusKg = surplusItems.filter(i => i.is_feed).reduce((s, i) => s + i.raw_diff, 0);
  const surplusPieces = surplusItems.filter(i => !i.is_feed).reduce((s, i) => s + i.raw_diff, 0);
  const totalCycleWared = items.reduce((s, i) => s + (i.cycle_wared || 0), 0);

  const feedShortageRates = shortageItems.filter(i => i.is_feed && i.kg_per_ton > 0).map(i => i.kg_per_ton);
  const avgKgPerTon = feedShortageRates.length ? (feedShortageRates.reduce((a, b) => a + b, 0) / feedShortageRates.length).toFixed(2) : '0';

  const sandNumbersStr = Array.from(batch.sandNumbers).join(' ، ') || 'سند تسوية جرد';
  const usersStr = Array.from(batch.users).join(' ، ') || 'mostafa';
  const cleanTime = (batch.latestTimestamp || '').substring(11, 19) || '12:00:00';
  const docCode = 'REC-' + targetDate.replace(/-/g, '') + '-' + totalItems + 'P';

  let h = '';

  // 1. Official Header
  h += '<div class="doc-header">';
  h += '  <div class="doc-header-col doc-header-right">';
  h += '    <div class="doc-company-logo"><img src="logo.png" alt="النور للأعلاف" /></div>';
  h += '    <div>';
  h += '      <h2 class="doc-company-name">شركة النور لتجارة وتصنيع الأعلاف</h2>';
  h += '      <div class="doc-sub">إدارة المخازن ورقابة المخزون والمحاسبة</div>';
  h += '      <div class="doc-sub">المستودع الرئيسي ومصنع الأعلاف</div>';
  h += '    </div>';
  h += '  </div>';
  h += '  <div class="doc-header-col doc-header-center">';
  h += '    <div class="doc-badge-title">محضر جرد وتسوية مخزنية رسمي</div>';
  h += '    <div class="doc-serial">رقم السند: <strong>' + sandNumbersStr + '</strong></div>';
  h += '    <div class="doc-type">نوع الإجراء: <span class="badge-audit">مطابقة فعلية واعتماد دفتري</span></div>';
  h += '  </div>';
  h += '  <div class="doc-header-col doc-header-left">';
  h += '    <div class="doc-meta-item"><span>تاريخ الجرد:</span> <strong>' + targetDate + '</strong></div>';
  h += '    <div class="doc-meta-item"><span>وقت التسجيل:</span> <strong dir="ltr">' + cleanTime + '</strong></div>';
  h += '    <div class="doc-meta-item"><span>رقم الوثيقة:</span> <strong>' + docCode + '</strong></div>';
  h += '    <div class="doc-meta-item"><span>الصفحة:</span> <strong>1 من 1</strong></div>';
  h += '  </div>';
  h += '</div>';

  // 2. Info Strip
  h += '<div class="doc-info-strip">';
  h += '  <div class="info-cell"><strong>تاريخ وساعة التسوية:</strong> ' + targetDate + ' ' + cleanTime + '</div>';
  h += '  <div class="info-cell"><strong>مسؤول التسجيل بالنظام:</strong> ' + usersStr + '</div>';
  h += '  <div class="info-cell"><strong>سند التسوية:</strong> ' + sandNumbersStr + '</div>';
  h += '  <div class="info-cell"><strong>عدد الأصناف بالجلسة:</strong> ' + totalItems + ' ' + (totalItems > 1 ? 'أصناف' : 'صنف') + '</div>';
  h += '</div>';

  // 3. Summary Metrics Cards
  h += '<div class="doc-summary-cards">';
  h += '  <div class="doc-sum-card accent">';
  h += '    <div class="doc-sum-title">إجمالي الأصناف المجرودة</div>';
  h += '    <div class="doc-sum-val">' + totalItems + ' صنف</div>';
  h += '  </div>';
  h += '  <div class="doc-sum-card ' + (shortageKg > 0 || shortagePieces > 0 ? 'danger' : '') + '">';
  h += '    <div class="doc-sum-title">إجمالي كميات العجز</div>';
  h += '    <div class="doc-sum-val">' + (shortageKg > 0 ? '-' + fmt(shortageKg) + ' كجم' : (shortagePieces > 0 ? '-' + shortagePieces + ' ق' : 'لا يوجد عجز')) + (shortageKg >= 1000 ? ' <small style="font-size:11px;color:#64748b;">(' + (Math.round(shortageKg/10)/100).toFixed(2) + ' طن)</small>' : '') + '</div>';
  h += '  </div>';
  h += '  <div class="doc-sum-card ' + (surplusKg > 0 || surplusPieces > 0 ? 'success' : '') + '">';
  h += '    <div class="doc-sum-title">إجمالي كميات الزيادة</div>';
  h += '    <div class="doc-sum-val">' + (surplusKg > 0 ? '+' + fmt(surplusKg) + ' كجم' : (surplusPieces > 0 ? '+' + surplusPieces + ' ق' : 'لا توجد زيادة')) + '</div>';
  h += '  </div>';
  h += '  <div class="doc-sum-card">';
  h += '    <div class="doc-sum-title">متوسط العجز في الطن للجلسة</div>';
  h += '    <div class="doc-sum-val" style="color:#d97706;">' + avgKgPerTon + ' <small style="font-size:12px;">كجم/طن</small></div>';
  h += '  </div>';
  h += '</div>';

  // 4. Details Table (10 Columns: Item Code removed, Bayan removed, "عجز آخر جرد" inserted before evaluation)
  h += '<div class="doc-table-wrap">';
  h += '  <table class="doc-table">';
  h += '    <thead>';
  h += '      <tr>';
  h += '        <th style="width:34px;">م</th>';
  h += '        <th class="col-name">اسم الصنف المجرود</th>';
  h += '        <th style="width:60px;">الوحدة</th>';
  h += '        <th style="width:115px;">الرصيد الدفتري<br><small>(قبل الجرد)</small></th>';
  h += '        <th style="width:115px;">الرصيد الفعلي<br><small>(المجرود)</small></th>';
  h += '        <th style="width:130px;">فارق الجرد الحالي<br><small>(عجز / زيادة)</small></th>';
  h += '        <th style="width:115px;">وارد دورة الجرد</th>';
  h += '        <th style="width:110px;">العجز بالطن / %</th>';
  h += '        <th style="width:125px;">عجز آخر جرد<br><small>(الجرد السابق)</small></th>';
  h += '        <th style="width:105px;">تقييم الجرد</th>';
  h += '      </tr>';
  h += '    </thead>';
  h += '    <tbody>';

  items.forEach((it, idx) => {
    const isShortage = it.raw_diff < 0;
    const isSurplus = it.raw_diff > 0;
    let diffClass = 'diff-matched';
    let diffLabel = 'مطابق (0)';
    if (isShortage) {
      diffClass = 'diff-shortage';
      diffLabel = '-' + fmt(it.diff) + ' ' + it.unit + ' (عجز)';
    } else if (isSurplus) {
      diffClass = 'diff-surplus';
      diffLabel = '+' + fmt(it.diff) + ' ' + it.unit + ' (زيادة)';
    }

    let rateText = '—';
    if (isShortage) {
      if (it.is_feed && it.kg_per_ton > 0) {
        rateText = '<strong>' + it.kg_per_ton + '</strong> كجم/طن';
      } else if (it.shortage_pct > 0) {
        rateText = '<strong>' + it.shortage_pct + '%</strong>';
      }
    }

    let prevCell = '<span style="color:#94a3b8;font-size:11px;">— (أول جرد)</span>';
    if (it.prev_raw_diff != null) {
      if (it.prev_raw_diff < 0) {
        prevCell = '<span style="color:#dc2626;font-weight:800;">-' + fmt(it.prev_diff) + ' ' + it.unit + '</span>' +
          (it.prev_audit_date ? '<small style="display:block;font-size:10px;color:#64748b;font-weight:600;">(' + it.prev_audit_date + ')</small>' : '');
      } else if (it.prev_raw_diff > 0) {
        prevCell = '<span style="color:#16a34a;font-weight:800;">+' + fmt(it.prev_diff) + ' ' + it.unit + '</span>' +
          (it.prev_audit_date ? '<small style="display:block;font-size:10px;color:#64748b;font-weight:600;">(' + it.prev_audit_date + ')</small>' : '');
      } else {
        prevCell = '<span style="color:#2563eb;font-weight:700;">0 (مطابق)</span>' +
          (it.prev_audit_date ? '<small style="display:block;font-size:10px;color:#64748b;font-weight:600;">(' + it.prev_audit_date + ')</small>' : '');
      }
    }

    let statusBadge = '<span class="doc-badge-status info">مطابق</span>';
    if (isShortage) {
      if (it.is_feed) {
        if (it.kg_per_ton > 10) statusBadge = '<span class="doc-badge-status danger">عجز مرتفع</span>';
        else if (it.kg_per_ton >= 3) statusBadge = '<span class="doc-badge-status warning">عجز متوسط</span>';
        else statusBadge = '<span class="doc-badge-status success">عجز طبيعي آمن</span>';
      } else {
        if (it.shortage_pct > 20) statusBadge = '<span class="doc-badge-status danger">عجز مرتفع</span>';
        else statusBadge = '<span class="doc-badge-status warning">عجز بالعدد</span>';
      }
    } else if (isSurplus) {
      statusBadge = '<span class="doc-badge-status success">زيادة مخزنية</span>';
    }

    h += '<tr>';
    h += '  <td style="font-weight:800;">' + (idx + 1) + '</td>';
    h += '  <td class="col-name">' + it.name + (it.is_cotton_based ? ' <span style="font-size:10px;color:#15803d;font-weight:700;">(بذرة قطن 100%)</span>' : '') + '</td>';
    h += '  <td>' + it.unit + '</td>';
    h += '  <td style="font-weight:700;">' + fmt(it.balance_before) + '</td>';
    h += '  <td style="font-weight:800;color:#1e293b;">' + fmt(it.balance_after) + '</td>';
    h += '  <td class="' + diffClass + '">' + diffLabel + '</td>';
    h += '  <td>' + (it.cycle_wared > 0 ? fmt(it.cycle_wared) + ' ' + (it.is_feed && it.cycle_wared >= 1000 ? '<small style="color:#64748b;">(' + (Math.round(it.cycle_wared/10)/100).toFixed(1) + 'ط)</small>' : '') : '—') + '</td>';
    h += '  <td>' + rateText + '</td>';
    h += '  <td>' + prevCell + '</td>';
    h += '  <td>' + statusBadge + '</td>';
    h += '</tr>';
  });

  h += '    </tbody>';
  h += '    <tfoot>';
  h += '      <tr>';
  h += '        <td colspan="3" style="text-align:right;padding-inline-start:12px;">الإجمالي العام للجلسة (' + totalItems + ' صنف)</td>';
  h += '        <td>—</td>';
  h += '        <td>—</td>';
  h += '        <td style="color:' + (shortageKg > 0 ? '#dc2626' : '#1e293b') + ';">' + (shortageKg > 0 ? 'عجز: -' + fmt(shortageKg) + ' كجم' : '') + (shortagePieces > 0 ? ' | -' + shortagePieces + ' ق' : '') + (surplusKg > 0 ? '<br>زيادة: +' + fmt(surplusKg) + ' كجم' : '') + '</td>';
  h += '        <td>وارد: ' + fmt(totalCycleWared) + ' كجم</td>';
  h += '        <td style="color:#d97706;">متوسط: ' + avgKgPerTon + ' كجم/طن</td>';
  h += '        <td>—</td>';
  h += '        <td style="font-size:11px;color:#15803d;">مطابق ومعتمد</td>';
  h += '      </tr>';
  h += '    </tfoot>';
  h += '  </table>';
  h += '</div>';

  // 5. Signatures Section (Compact single-line per role: signature only + stamp box)
  h += '<div class="doc-signatures">';

  // Storekeeper
  h += '  <div class="sig-block">';
  h += '    <div class="sig-role">طرف أول: أمين المخزن والعهدة</div>';
  h += '    <div class="sig-desc">الحصر الفعلي والمطابقة على الطبيعة</div>';
  h += '    <div class="sig-line" style="margin-top:14px;"><span>التوقيع:</span> .....................................................</div>';
  h += '  </div>';

  // Accountant
  h += '  <div class="sig-block">';
  h += '    <div class="sig-role">طرف ثانٍ: المحاسب ومراجع الجرد</div>';
  h += '    <div class="sig-desc">المراجعة والتدقيق الدفتري واحتساب المعدلات</div>';
  h += '    <div class="sig-line" style="margin-top:14px;"><span>التوقيع:</span> .....................................................</div>';
  h += '  </div>';

  // Management
  h += '  <div class="sig-block">';
  h += '    <div class="sig-role">اعتماد الإدارة والمدير المالي</div>';
  h += '    <div class="sig-desc">الاعتماد النهائي والتوجيه بالقيد الدفتري</div>';
  h += '    <div class="sig-line" style="margin-top:8px;"><span>التوقيع:</span> .....................................................</div>';
  h += '    <div class="sig-stamp-box">[ خاتم الشركة والاعتماد الرسمي ]</div>';
  h += '  </div>';

  h += '</div>';

  // Set adaptive density class based on items count
  paper.classList.remove('density-spacious', 'density-normal', 'density-compact');
  if (totalItems <= 4) {
    paper.classList.add('density-spacious');
  } else if (totalItems <= 7) {
    paper.classList.add('density-normal');
  } else {
    paper.classList.add('density-compact');
  }

  paper.innerHTML = h;
}

function renderReconciliationTab(data) {
  const rec = (data && data.reconciliations) || {};
  const items = rec.items || [];
  if (!items.length) return '<div class="empty-state"><p>لا توجد بيانات تسويات جرد مسجلة</p></div>';

  const batches = getReconciliationBatches(data);
  const batchDates = Object.keys(batches).sort().reverse();
  const latestBatchDate = batchDates[0] || '';
  const latestBatch = latestBatchDate ? batches[latestBatchDate] : null;
  const latestBatchCount = latestBatch ? latestBatch.items.length : 0;

  const feedCount = items.filter(i => i.is_feed || i.unit === 'كيلو').length;
  const bagsCount = items.filter(i => !(i.is_feed || i.unit === 'كيلو')).length;
  const shortageCount = items.filter(i => i.raw_diff < 0).length;
  const surplusCount = items.filter(i => i.raw_diff > 0).length;
  const highShortageCount = items.filter(i => (i.is_feed || i.unit === 'كيلو') ? i.kg_per_ton > 10 : i.shortage_pct > 20).length;

  let html = '<div class="rec-actions-bar">' +
               '<div class="rec-actions-info">' +
                 '<div class="rec-actions-title">' +
                   '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
                   'محضر الجرد والتسوية المخزنية الرسمي' +
                 '</div>' +
                 '<div class="rec-actions-sub">' +
                   (latestBatchDate ? 'آخر جلسة جرد: <strong>' + latestBatchDate + '</strong> (شملت تسوية ' + latestBatchCount + ' صنف معاً بموجب السند)' : 'لا توجد جلسات جرد مسجلة') +
                 '</div>' +
               '</div>' +
               '<div class="rec-actions-btns">' +
                 '<button class="btn-primary-minutes" onclick="openMinutesModal(\'' + latestBatchDate + '\')">' +
                   '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 12 18 15 15"/><line x1="12" y1="12" x2="12" y2="18"/></svg>' +
                   '📄 استخراج وطباعة محضر آخر جرد' +
                 '</button>' +
                 '<button class="rec-item-minutes-btn" style="padding:7px 12px;font-size:12px;" onclick="openMinutesModal()">' +
                   '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
                   'سجل كافة المحاضر (' + batchDates.length + ')' +
                 '</button>' +
               '</div>' +
             '</div>';

  html += '<div class="filters">';
  html += '<button class="chip rec-chip '+(recFilter==='all'?'active':'')+'" data-recfilter="all">الكل ('+items.length+')</button>';
  html += '<button class="chip rec-chip '+(recFilter==='feed'?'active':'')+'" data-recfilter="feed">🌾 خامات وأعلاف ('+feedCount+')</button>';
  html += '<button class="chip rec-chip '+(recFilter==='bags'?'active':'')+'" data-recfilter="bags">📦 مستلزمات وتعبئة ('+bagsCount+')</button>';
  html += '<button class="chip rec-chip '+(recFilter==='shortage'?'active':'')+'" data-recfilter="shortage">🔴 أصناف بها عجز ('+shortageCount+')</button>';
  html += '<button class="chip rec-chip '+(recFilter==='surplus'?'active':'')+'" data-recfilter="surplus">🟢 أصناف بها زيادة ('+surplusCount+')</button>';
  html += '<button class="chip rec-chip '+(recFilter==='high'?'active':'')+'" data-recfilter="high">⚠️ عجز مرتفع ('+highShortageCount+')</button>';
  html += '</div>';

  html += '<div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="recSearchInput" placeholder="ابحث باسم الصنف أو الكود في تسويات الجرد..." /></div>';

  html += '<div class="rec-banner">' +
            '<div class="rec-banner-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>' +
            '<div class="rec-banner-text">' +
              '<strong>دليل احتساب التسويات والمعدلات للمصنع:</strong> ' +
              'تُحسب نسبة ومعدل العجز في الطن بمقارنة كمية العجز بإجمالي الوارد الفعلي خلال دورة الجرد (من التسوية السابقة حتى الحالية). ' +
              '<strong>كسب النور:</strong> استثناء خاص محسوب تلقائياً من وارد بذرة القطن بنسبة 100%.' +
            '</div>' +
          '</div>';

  const filtered = items.filter(item => {
    const isKilo = item.is_feed || item.unit === 'كيلو';
    if (recFilter === 'feed') return isKilo;
    if (recFilter === 'bags') return !isKilo;
    if (recFilter === 'shortage') return item.raw_diff < 0;
    if (recFilter === 'surplus') return item.raw_diff > 0;
    if (recFilter === 'high') return isKilo ? item.kg_per_ton > 10 : item.shortage_pct > 20;
    return true;
  });

  if (!filtered.length) {
    return html + '<div class="empty-state"><p>لا توجد أصناف مطابقة للفلتر المحدد</p></div>';
  }

  html += '<div class="bar-list" id="recList">';

  let idx = 1;
  let shownFeedDivider = false;
  let shownBagsDivider = false;

  filtered.forEach(item => {
    const isShortage = item.raw_diff < 0;
    const isSurplus = item.raw_diff > 0;
    const isKilo = item.is_feed || item.unit === 'كيلو';
    const cleanDate = (item.last_tasweya_date || '').replace('T', ' ').substring(0, 16);

    // Group dividers when viewing "all"
    if (recFilter === 'all') {
      if (isKilo && !shownFeedDivider) {
        html += '<div class="group-header">🌾 خامات وأعلاف مصنع النور <span class="group-count">' + feedCount + ' صنف</span></div>';
        shownFeedDivider = true;
      } else if (!isKilo && !shownBagsDivider) {
        html += '<div class="group-header" style="margin-top:16px;">📦 مستلزمات التعبئة والتغليف (الشكاير بالقطعة) <span class="group-count">' + bagsCount + ' صنف</span></div>';
        shownBagsDivider = true;
      }
    }

    // Pill color & label (Top Right)
    let pillBg = 'var(--accent-soft)';
    let pillColor = 'var(--accent-ink)';
    let pillText = 'مطابق (0)';
    if (isShortage) {
      pillBg = 'var(--danger-bg)';
      pillColor = 'var(--danger)';
      pillText = 'عجز: -' + fmt(item.diff) + ' ' + item.unit;
    } else if (isSurplus) {
      pillBg = 'var(--success-bg)';
      pillColor = 'var(--success)';
      pillText = 'زيادة: +' + fmt(item.diff) + ' ' + item.unit;
    }

    // Bar fill styling & progress width calculation
    let fillClass = 'c4';
    let fillWidth = 10;
    if (isShortage) {
      if (isKilo) {
        if (item.kg_per_ton > 10) fillClass = 'c5';
        else if (item.kg_per_ton >= 3) fillClass = 'c3';
        else fillClass = 'c2';
        fillWidth = Math.min(Math.max((item.kg_per_ton / 15) * 100, 8), 100);
      } else {
        fillClass = item.shortage_pct > 20 ? 'c5' : 'c3';
        fillWidth = Math.min(Math.max(item.shortage_pct, 10), 100);
      }
    } else if (isSurplus) {
      fillClass = 'c2';
      fillWidth = 35;
    }

    // Badge calculation
    let badgeCls = 'ok';
    let badgeTxt = 'فائض جرد';
    if (isShortage) {
      if (isKilo) {
        if (item.kg_per_ton > 10) {
          badgeCls = 'out';
          badgeTxt = '⚠️ عجز مرتفع';
        } else if (item.kg_per_ton >= 3) {
          badgeCls = 'low';
          badgeTxt = '⚠️ عجز متوسط';
        } else {
          badgeCls = 'ok';
          badgeTxt = 'عجز طبيعي آمن';
        }
      } else {
        if (item.shortage_pct > 20) {
          badgeCls = 'out';
          badgeTxt = 'عجز مرتفع بالقطع';
        } else if (item.shortage_pct >= 5) {
          badgeCls = 'low';
          badgeTxt = 'عجز متوسط بالقطع';
        } else {
          badgeCls = 'ok';
          badgeTxt = 'عجز طبيعي';
        }
      }
    }

    const histId = 'recHist_' + item.code;

    html += '<div class="bar-item" data-name="' + (item.name + ' ' + item.code).toLowerCase() + '">';
    
    // Header Row
    html += '<div class="bar-item-header">';
    html += '  <div>';
    html += '    <div class="bar-item-name">' + (idx++) + '. ' + item.name;
    html += '      <span style="font-size:12px;font-weight:700;color:var(--ink-3);margin-inline-start:4px;">(كود: ' + item.code + ')</span>';
    if (isKilo) {
      html += '      <span class="rec-cat-tag feed">🌾 خامات</span>';
    } else {
      html += '      <span class="rec-cat-tag bags">📦 مستلزمات</span>';
    }
    if (item.is_cotton_based) {
      html += '      <span class="rec-tag-cotton">🌱 الوارد من بذرة القطن (100%)</span>';
    }
    html += '    </div>';
    html += '    <div style="font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
    html += '      <span>تاريخ آخر جرد: <strong>' + cleanDate + '</strong> | إجمالي التسويات: ' + item.total_tasweyat + '</span>';
    if (cleanDate) {
      html += '      <button class="rec-item-minutes-btn" onclick="openMinutesModal(\'' + cleanDate.substring(0, 10) + '\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> محضر هذا الجرد</button>';
    }
    html += '    </div>';
    html += '  </div>';
    html += '  <span class="bar-item-pct" style="background:' + pillBg + ';color:' + pillColor + ';min-width:auto;padding:4px 12px;font-size:13px;border-radius:999px;">' + pillText + '</span>';
    html += '</div>';

    // Visual Progress Bar
    html += '<div class="bar-track"><div class="bar-fill ' + fillClass + '" style="width:' + fillWidth.toFixed(1) + '%"></div></div>';

    // Primary Footer
    html += '<div class="bar-item-footer">';
    html += '  <div class="bar-item-balance">الرصيد بعد الجرد: <strong>' + fmt(item.balance_after) + '</strong> ' + item.unit + '</div>';
    html += '  <div class="bar-item-balance">' + (item.is_cotton_based ? 'وارد البذرة بالدورة: ' : 'وارد الدورة: ') + '<strong>' + fmt(item.cycle_wared) + '</strong> ' + item.unit + (isKilo && item.cycle_wared >= 1000 ? ' <small style="color:var(--ink-3);">(' + fmt(Math.round(item.cycle_wared/10)/100) + ' طن)</small>' : '') + '</div>';
    
    if (isShortage) {
      if (isKilo) {
        html += '  <div class="bar-item-balance">عجز آخر دورة: <strong style="color:var(--danger);">' + item.kg_per_ton + ' كجم/طن</strong> <small style="color:var(--ink-3);">(' + item.shortage_pct + '%)</small></div>';
      } else {
        html += '  <div class="bar-item-balance">نسبة عجز آخر دورة: <strong style="color:var(--danger);">' + item.shortage_pct + '%</strong> <small style="color:var(--ink-3);">(بالعدد)</small></div>';
      }
    } else {
      html += '  <div class="bar-item-balance">الحالة: <strong style="color:var(--success);">زيادة في آخر جرد</strong></div>';
    }

    if (item.avg_kg_per_ton > 0 || item.avg_shortage_pct > 0) {
      if (isKilo) {
        html += '  <div class="bar-item-balance" style="background:var(--accent-soft);padding:3px 10px;border-radius:var(--r-sm);border:1.5px solid var(--line);">متوسط العجز في الطن: <strong style="color:var(--danger);font-size:14px;">' + item.avg_kg_per_ton + ' كجم/طن</strong> <small style="color:var(--ink-3);">(' + item.total_tasweyat + ' تسويات)</small></div>';
      } else {
        html += '  <div class="bar-item-balance" style="background:var(--accent-soft);padding:3px 10px;border-radius:var(--r-sm);border:1.5px solid var(--line);">متوسط نسبة العجز: <strong style="color:var(--danger);font-size:14px;">' + item.avg_shortage_pct + '%</strong> <small style="color:var(--ink-3);">(' + item.total_tasweyat + ' تسويات)</small></div>';
      }
    }
    
    html += '  <span class="bar-item-badge ' + badgeCls + '">' + badgeTxt + '</span>';
    html += '</div>';

    // Secondary row: Post-reconciliation wared + current stock balance + history button
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-soft);font-size:12px;color:var(--ink-2);flex-wrap:wrap;gap:8px;">';
    html += '  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">';
    html += '    <div>الوارد بعد آخر جرد (حتى الآن): <strong style="color:var(--info);">' + fmt(item.post_wared) + ' ' + item.unit + '</strong> ' + (item.post_wared > 0 ? (isKilo && item.post_wared >= 1000 ? '<span style="color:var(--ink-3);">(' + fmt(Math.round(item.post_wared/10)/100) + ' طن جديد)</span>' : '<span style="color:var(--ink-3);">(بضاعة بعد الجرد)</span>') : '<span style="color:var(--ink-3);">(لا يوجد)</span>') + '</div>';
    if (item.current_stock_balance != null) {
      html += '    <div style="padding-inline-start:12px;border-inline-start:1.5px solid var(--line);">رصيد المخزن الفعلي: <strong style="color:var(--accent);">' + fmt(item.current_stock_balance) + ' ' + item.unit + '</strong> ' + (isKilo && item.current_stock_balance >= 1000 ? '<span style="color:var(--ink-3);">(' + fmt(Math.round(item.current_stock_balance/10)/100) + ' طن)</span>' : '') + '</div>';
    }
    html += '  </div>';
    const isHistOpen = openRecHistories.has(histId);
    html += '  <button class="rec-history-toggle ' + (isHistOpen ? 'open' : '') + '" data-hist-btn="' + histId + '" onclick="toggleRecHistory(\'' + histId + '\', this)">';
    html += '    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '    سجل كافة التسويات (' + item.total_tasweyat + ')';
    html += '  </button>';
    html += '</div>';

    // Collapsible history table (preserves open state across renders)
    html += '<div class="rec-history-content" id="' + histId + '" style="display:' + (isHistOpen ? 'block' : 'none') + ';margin-top:10px;">';
    html += '  <div class="rec-table-wrap">';
    html += '    <table class="rec-table">';
    html += '      <thead><tr>';
    html += '        <th class="col-date">تاريخ التسوية</th>';
    html += '        <th class="col-bayan">البيان / السند</th>';
    html += '        <th class="col-diff">الحالة والكمية</th>';
    html += '        <th class="col-bal">الرصيد بعدها</th>';
    html += '        <th class="col-wared">وارد الدورة</th>';
    html += '        <th class="col-rate">' + (isKilo ? 'العجز في الطن' : 'نسبة العجز') + '</th>';
    html += '        <th class="col-user">المستخدم</th>';
    html += '      </tr></thead>';
    html += '      <tbody>';

    (item.history || []).forEach(h => {
      const hIsShort = h.raw_diff < 0;
      const hIsSurp = h.raw_diff > 0;
      const hClass = hIsShort ? 'color:var(--danger);font-weight:800;' : (hIsSurp ? 'color:var(--success);font-weight:800;' : 'font-weight:700;');
      const hSign = hIsShort ? '-' : (hIsSurp ? '+' : '');
      const hDate = (h.date || '').replace('T', ' ').substring(0, 16);

      html += '<tr>';
      html += '  <td class="col-date"><span dir="ltr" style="display:inline-block;font-family:inherit;">' + hDate + '</span></td>';
      html += '  <td class="col-bayan">' + (h.bayan || '—') + '</td>';
      html += '  <td class="col-diff" style="' + hClass + '">' + hSign + fmt(h.diff) + ' ' + item.unit + ' (' + h.status + ')</td>';
      html += '  <td class="col-bal">' + fmt(h.balance) + ' ' + item.unit + '</td>';
      html += '  <td class="col-wared">' + (h.cycle_wared > 0 ? fmt(h.cycle_wared) + ' ' + item.unit : '—') + '</td>';
      html += '  <td class="col-rate">' + (hIsShort && isKilo && h.kg_per_ton > 0 ? '<strong>' + h.kg_per_ton + '</strong> كجم/طن' : (hIsShort ? h.shortage_pct + '%' : '—')) + '</td>';
      html += '  <td class="col-user"><span dir="auto" style="display:inline-block;">' + (h.user || '—') + '</span> <button class="rec-item-minutes-btn" style="padding:1px 6px;font-size:10px;margin-inline-start:4px;" onclick="openMinutesModal(\'' + hDate.substring(0, 10) + '\')">📄 المحضر</button></td>';
      html += '</tr>';
    });

    html += '      </tbody>';
    html += '      <tfoot>';
    html += '        <tr style="background:var(--bg-soft);font-weight:800;border-top:2px solid var(--line);">';
    html += '          <td class="col-date" style="font-weight:900;color:var(--accent-ink);text-align:center;">المتوسط العام</td>';
    html += '          <td class="col-bayan" style="font-weight:700;color:var(--ink-2);text-align:right;">كافة التسويات (' + item.total_tasweyat + ')</td>';
    html += '          <td class="col-diff" style="font-weight:900;text-align:center;color:' + (item.total_shortage_qty > 0 ? 'var(--danger)' : 'var(--ink)') + ';">' + (item.total_shortage_qty > 0 ? 'إجمالي العجز: -' + fmt(item.total_shortage_qty) + ' ' + item.unit : 'لا يوجد عجز') + '</td>';
    html += '          <td class="col-bal" style="text-align:center;">—</td>';
    html += '          <td class="col-wared" style="font-weight:800;text-align:center;">إجمالي الوارد: ' + fmt(item.total_cycle_wared) + ' ' + item.unit + '</td>';
    html += '          <td class="col-rate" style="font-weight:900;color:var(--danger);font-size:13px;text-align:center;">' + (isKilo ? 'متوسط: <strong>' + (item.avg_kg_per_ton > 0 ? item.avg_kg_per_ton + '</strong> كجم/طن' : '0</strong>') : 'متوسط: <strong>' + (item.avg_shortage_pct > 0 ? item.avg_shortage_pct + '</strong>%' : '0%</strong>')) + '</td>';
    html += '          <td class="col-user" style="text-align:center;font-size:11px;color:var(--ink-3);">معدل تراكمي</td>';
    html += '        </tr>';
    html += '      </tfoot>';
    html += '    </table>';
    html += '  </div>';
    html += '</div>';

    html += '</div>'; // end bar-item
  });

  html += '</div>';
  return html;
}

function renderPricesTab(data) {
  const allItems = (data.invoices && data.invoices.items) || [];
  if (!allItems.length) return '<div class="empty-state"><p>لا توجد بيانات</p></div>';
  let html = '<div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="searchInput" placeholder="ابحث عن صنف..." /></div>';
  html += '<div class="bar-list" id="invList">';
  let pIdx = 1;
  allItems.forEach(item=>{
    if ((item.avg_price||0) <= 0) return;
    html += '<div class="price-item" data-name="'+(item.name||'').toLowerCase()+'"><div class="price-item-header"><div><div class="price-name">'+(pIdx++)+'. '+item.name+'</div></div><div class="price-value"><span style="font-size:12px; font-weight:700; color:var(--ink-3); margin-left:6px; display:inline-block; vertical-align:middle;">متوسط:</span>'+fmt(item.avg_price)+'</div></div><div class="price-meta"><span>مسحوب: <strong>'+fmt(item.total_out)+'</strong> '+(item.unit||'')+'</span><span>فواتير: <strong>'+item.invoice_count+'</strong></span></div></div>';
  });
  html += '</div>';
  return html;
}

function setPill(s,t) { document.getElementById('livePill').className='live-pill '+s; document.getElementById('liveText').textContent=t; }
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

function renderContent() {
  const c = document.getElementById('content');
  if (!lastData) { c.innerHTML = '<div class="skeleton skeleton-item"></div><div class="skeleton skeleton-item"></div>'; return; }
  let html = renderKPIs(lastData, activeTab);

  const titles = {
    balance: 'نسبة كل صنف من إجمالي المخزون',
    customers: 'تحليل العملاء',
    prices: 'أسعار الأصناف',
    salesrate: 'تحليل ومعدل المبيعات',
    reconciliation: 'تحليل دقيق لعمليات تسوية الجرد ومعدلات العجز'
  };
  html += '<div class="section-title">'+(titles[activeTab]||'')+'<div class="line"></div></div>';
  if (activeTab==='balance') html += renderBalanceTab(lastData);
  else if (activeTab==='customers') html += renderCustomersTab(lastData);
  else if (activeTab==='prices') html += renderPricesTab(lastData);
  else if (activeTab==='salesrate') html += renderSalesRateTab(lastData);
  else if (activeTab==='reconciliation') html += renderReconciliationTab(lastData);
  c.innerHTML = html;

  const si = document.getElementById('searchInput');
  if (si) { si.addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); document.querySelectorAll('#invList .bar-item, #invList .price-item, #invList .cust-item').forEach(it=>{ it.style.display=(it.dataset.name||'').includes(q)?'':'none'; }); }); }
  
  const recSearch = document.getElementById('recSearchInput');
  if (recSearch) {
    recSearch.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('#recList .bar-item').forEach(it => {
        it.style.display = (it.dataset.name||'').includes(q)?'':'none';
      });
    });
  }
  document.querySelectorAll('.rec-chip').forEach(ch => {
    ch.addEventListener('click', () => {
      recFilter = ch.dataset.recfilter;
      renderContent();
    });
  });

  document.querySelectorAll('.chip[data-filter]').forEach(ch=>{ ch.addEventListener('click',()=>{ activeFilter=ch.dataset.filter; renderContent(); }); });
  document.querySelectorAll('.sort-chip').forEach(ch=>{ ch.addEventListener('click',()=>{ salesSort=ch.dataset.sort; renderContent(); }); });
  document.querySelectorAll('.date-chip').forEach(ch=>{ ch.addEventListener('click',()=>{ dateFilter=ch.dataset.date; renderContent(); }); });
  const dateApply = document.getElementById('dateApply');
  if (dateApply) { dateApply.addEventListener('click',()=>{ customDateStart=document.getElementById('dateStart').value; customDateEnd=document.getElementById('dateEnd').value; renderContent(); }); }

  // Click on item in salesrate tab to show detail chart
  if (activeTab === 'salesrate') {
    const allItems = (lastData.invoices && lastData.invoices.items) || [];
    
    const bindCloseBtn = (detail) => {
      const closeBtn = document.getElementById('closeChartBtn');
      if (closeBtn) closeBtn.addEventListener('click', () => {
        activeChartItemName = null;
        detail.innerHTML = '';
      });
    };

    if (activeChartItemName) {
      const matched = allItems.find(i => i.name === activeChartItemName);
      if (matched) {
        const detail = document.getElementById('detailChart');
        if (detail) {
          detail.innerHTML = renderItemDetailChart(matched, 30);
          bindCloseBtn(detail);
        }
      } else {
        activeChartItemName = null;
      }
    }

    document.querySelectorAll('#invList .bar-item').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        const name = el.dataset.name || '';
        const item = allItems.find(i => (i.name||'').toLowerCase() === name);
        const detail = document.getElementById('detailChart');
        if (item && detail) {
          activeChartItemName = item.name;
          detail.innerHTML = renderItemDetailChart(item, 30);
          bindCloseBtn(detail);
          detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    });
    // Also react to search: if exact match, show chart
    const si2 = document.getElementById('searchInput');
    if (si2) {
      si2.addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        if (q.length >= 2) {
          const matched = allItems.find(i => (i.name||'').toLowerCase().includes(q));
          if (matched) {
            activeChartItemName = matched.name;
            const detail = document.getElementById('detailChart');
            if (detail) {
              detail.innerHTML = renderItemDetailChart(matched, 30);
              bindCloseBtn(detail);
            }
          }
        }
      });
    }
  } else {
    activeChartItemName = null;
  }
}

function loadData() {
  if (typeof EMBEDDED_DATA!=='undefined' && EMBEDDED_DATA) {
    // Return inventory data immediately, load invoices async to avoid browser freeze
    const base = {
      generated_at: EMBEDDED_DATA.generated_at,
      print_date: EMBEDDED_DATA.print_date,
      invoices_print_date: EMBEDDED_DATA.invoices_print_date,
      store_name: EMBEDDED_DATA.store_name,
      inventory: EMBEDDED_DATA.inventory,
      reconciliations: EMBEDDED_DATA.reconciliations,
      invoices: { items: [], top_customers: [], daily_totals: [], print_date: '', total_transactions: 0 },
      stats: { ...EMBEDDED_DATA.stats, total_transactions: 0 }
    };
    // Load invoices data in next tick
    setTimeout(function() {
      if (lastData && EMBEDDED_DATA.invoices) {
        lastData.invoices = EMBEDDED_DATA.invoices;
        lastData.stats.total_transactions = EMBEDDED_DATA.stats.total_transactions;
        setPill('live','مباشر');
        renderContent();
      }
    }, 100);
    return Promise.resolve(base);
  }
  return fetch('inventory_data.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);
}

async function refresh(silent) {
  if (!silent) { setPill('syncing','جاري التحديث...'); document.getElementById('refreshIcon').classList.add('spinning'); }
  const data = await loadData();
  if (!data) { setPill('stale','تعذّر التحديث'); if(!silent){document.getElementById('refreshIcon').classList.remove('spinning');toast('تعذّر تحديث البيانات');} return; }
  lastData = filterExcludedItems(data);
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  if (data.print_date) document.getElementById('printDate').textContent = 'تاريخ التقرير: '+data.print_date;
  setPill('live','مباشر');
  if (!silent) { document.getElementById('refreshIcon').classList.remove('spinning'); toast('تم تحديث البيانات'); }
  renderContent();
}

document.getElementById('refreshBtn').addEventListener('click',()=>refresh(false));
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.querySelectorAll('.tab').forEach(t=>{ t.addEventListener('click',()=>{ activeTab=t.dataset.tab; activeFilter='all'; dateFilter='all'; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t)); renderContent(); }); });

refresh(true).then(()=>{ setInterval(()=>{ fetch('inventory_data.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{ if(d){lastData=filterExcludedItems(d);document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});setPill('live','مباشر');renderContent();} }).catch(()=>{}); },60000); });
</script>
