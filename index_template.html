<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>تطبيق إدارة المخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff; --bg-card: #fff; --bg-soft: #e8eef9; --bg-hover: #dde6f5;
    --ink: #1a2151; --ink-2: #4a5578; --ink-3: #8895b3;
    --line: #d8e0f0; --line-soft: #edf1fa;
    --accent: #5b6ef5; --accent-light: #7d8ffa; --accent-soft: #eaeefc; --accent-ink: #3a47c7;
    --success: #22c55e; --success-bg: #d4f7e0;
    --warning: #f59e0b; --warning-bg: #fef0d0;
    --danger: #ef4444; --danger-bg: #fde0e0;
    --info: #0ea5e9; --info-bg: #d6f0fb;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --sh-xs: 0 1px 3px rgba(30,40,90,.05); --sh-sm: 0 3px 12px rgba(30,40,90,.07); --sh-md: 0 6px 24px rgba(30,40,90,.09); --sh-lg: 0 12px 40px rgba(30,40,90,.12);
    --tr: .28s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"] {
    --bg: #0f172a; --bg-card: #1e293b; --bg-soft: #334155; --bg-hover: #475569;
    --ink: #f1f5f9; --ink-2: #cbd5e1; --ink-3: #94a3b8;
    --line: #334155; --line-soft: #1e293b;
    --accent: #818cf8; --accent-light: #a5b4fc; --accent-soft: #312e81; --accent-ink: #c7d2fe;
    --success: #4ade80; --success-bg: #166534;
    --warning: #fbbf24; --warning-bg: #78350f;
    --danger: #f87171; --danger-bg: #7f1d1d;
    --info: #38bdf8; --info-bg: #0c4a6e;
    --sh-xs: 0 1px 3px rgba(0,0,0,.3); --sh-sm: 0 3px 12px rgba(0,0,0,.4); --sh-md: 0 6px 24px rgba(0,0,0,.5); --sh-lg: 0 12px 40px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: "Cairo","Segoe UI","Tahoma",sans-serif; font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .3s, color .3s; }
  .app { max-width: 1400px; margin: 0 auto; padding: 0 14px 80px; }

  .header { position: sticky; top: 0; z-index: 100; background: rgba(240,244,255,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 12px 14px; border-bottom: 1.5px solid var(--line); margin: 0 -14px 16px; }
  [data-theme="dark"] .header { background: rgba(15,23,42,.92); }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: var(--r-sm); display: grid; place-items: center; color: #fff; box-shadow: var(--sh-sm); flex-shrink: 0; }
  .header-logo svg { width: 22px; height: 22px; }
  .header-text { min-width: 0; }
  .header-text h1 { font-size: 16px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-text p { font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .theme-btn { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--bg-card); border: 1.5px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); transition: var(--tr); flex-shrink: 0; }
  .theme-btn:hover { background: var(--bg-soft); }
  .theme-btn svg { width: 18px; height: 18px; }

  .print-btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border-radius: var(--r-sm); background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--tr); font-family: inherit; flex-shrink: 0; }
  .print-btn:hover { background: var(--accent-ink); }
  .print-btn svg { width: 16px; height: 16px; }

  .live-pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .live-pill.live { background: var(--success-bg); color: var(--success); }
  .live-pill.syncing { background: var(--info-bg); color: var(--info); }
  .live-pill.stale { background: var(--warning-bg); color: var(--warning); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
  .live-pill.live .live-dot { background: var(--success); }
  .live-pill.syncing .live-dot { background: var(--info); }
  .live-pill.stale .live-dot { background: var(--warning); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }

  .update-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--bg-card); border-radius: var(--r-md); margin-bottom: 16px; box-shadow: var(--sh-xs); flex-wrap: wrap; }
  .update-info { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .update-info strong { color: var(--ink); font-weight: 800; }
  .btn-refresh { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border-radius: var(--r-sm); background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--tr); font-family: inherit; }
  .btn-refresh:hover { background: var(--accent-ink); }
  .btn-refresh:active { transform: scale(.96); }
  .btn-refresh svg { width: 16px; height: 16px; }
  .spinning { animation: spin .8s linear infinite; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .kpi-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: var(--bg-card); border-radius: var(--r-lg); padding: 16px 14px; box-shadow: var(--sh-sm); position: relative; overflow: hidden; border: 1.5px solid var(--line-soft); }
  .kpi-card::after { content: ''; position: absolute; top: -20px; inset-inline-end: -20px; width: 70px; height: 70px; border-radius: 50%; opacity: .06; }
  .kpi-card.accent::after { background: var(--accent); }
  .kpi-card.success::after { background: var(--success); }
  .kpi-card.warning::after { background: var(--warning); }
  .kpi-card.info::after { background: var(--info); }
  .kpi-icon { width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; margin-bottom: 8px; }
  .kpi-card.accent .kpi-icon { background: var(--accent-soft); color: var(--accent-ink); }
  .kpi-card.success .kpi-icon { background: var(--success-bg); color: var(--success); }
  .kpi-card.warning .kpi-icon { background: var(--warning-bg); color: var(--warning); }
  .kpi-card.info .kpi-icon { background: var(--info-bg); color: var(--info); }
  .kpi-icon svg { width: 20px; height: 20px; }
  .kpi-label { font-size: 12px; color: var(--ink-2); font-weight: 700; margin-bottom: 3px; }
  .kpi-value { font-size: 26px; font-weight: 900; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi-sub { font-size: 11px; font-weight: 600; margin-top: 4px; color: var(--ink-3); }

  .tabs { display: flex; gap: 5px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 3px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 9px 16px; border-radius: var(--r-md); font-size: 14px; font-weight: 700; color: var(--ink-2); background: var(--bg-card); border: 2px solid var(--line); cursor: pointer; transition: var(--tr); font-family: inherit; white-space: nowrap; }
  .tab:hover { background: var(--bg-soft); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .section-title { font-size: 17px; font-weight: 900; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .section-title .line { flex: 1; height: 2px; background: linear-gradient(90deg, var(--line), transparent); border-radius: 1px; }

  .search-box { position: relative; margin-bottom: 14px; }
  .search-input { width: 100%; padding: 12px 14px 12px 14px; padding-inline-start: 44px; padding-inline-end: 14px; border: 2px solid var(--line); border-radius: var(--r-md); font-size: 15px; font-family: inherit; background: var(--bg-card); color: var(--ink); transition: var(--tr); outline: none; font-weight: 600; }
  .search-input:focus { border-color: var(--accent-light); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search-input::placeholder { color: var(--ink-3); font-weight: 500; }
  .search-icon { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 20px; height: 20px; pointer-events: none; }

  .filters { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 3px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--bg-card); color: var(--ink-2); border: 2px solid var(--line); cursor: pointer; transition: var(--tr); font-family: inherit; white-space: nowrap; }
  .chip:hover { background: var(--bg-soft); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .date-filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .date-chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--bg-card); color: var(--ink-2); border: 2px solid var(--line); cursor: pointer; transition: var(--tr); font-family: inherit; }
  .date-chip:hover { background: var(--bg-soft); }
  .date-chip.active { background: var(--info); color: #fff; border-color: var(--info); }
  .date-range { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .date-input { padding: 7px 10px; border: 2px solid var(--line); border-radius: var(--r-sm); font-size: 13px; font-family: inherit; background: var(--bg-card); color: var(--ink); }
  .date-input:focus { border-color: var(--accent-light); outline: none; }
  .date-btn { padding: 7px 14px; border-radius: var(--r-sm); background: var(--accent); color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .bar-list { display: flex; flex-direction: column; gap: 8px; }
  .group-header { font-size: 14px; font-weight: 900; color: var(--accent-ink); margin: 12px 0 6px; padding: 7px 12px; background: var(--accent-soft); border-radius: var(--r-sm); display: flex; align-items: center; gap: 6px; }
  .group-count { font-size: 11px; font-weight: 800; color: var(--accent); background: var(--bg-card); padding: 2px 8px; border-radius: 999px; }

  .bar-item { background: var(--bg-card); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--sh-xs); border: 1.5px solid var(--line-soft); transition: var(--tr); }
  .bar-item:hover { box-shadow: var(--sh-md); border-color: var(--accent-light); }
  .bar-item-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .bar-item-name { font-size: 15px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
  .bar-item-pct { flex-shrink: 0; font-size: 14px; font-weight: 900; color: var(--accent-ink); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; min-width: 50px; text-align: center; font-variant-numeric: tabular-nums; }
  .bar-track { width: 100%; height: 20px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; margin-bottom: 6px; border: 1px solid var(--line-soft); }
  .rec-cat-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; vertical-align: middle; margin-inline-start: 6px; }
  .rec-cat-tag.feed { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid rgba(91,110,245,0.25); }
  .rec-cat-tag.bags { background: var(--bg-soft); color: var(--ink-2); border: 1px solid var(--line); }
  .rec-tag-cotton { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; vertical-align: middle; margin-inline-start: 6px; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .bar-fill.c1 { background: linear-gradient(90deg,#5b6ef5,#7d8ffa); }
  .bar-fill.c2 { background: linear-gradient(90deg,#22c55e,#4ade80); }
  .bar-fill.c3 { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
  .bar-fill.c4 { background: linear-gradient(90deg,#0ea5e9,#38bdf8); }
  .bar-fill.c5 { background: linear-gradient(90deg,#ef4444,#f87171); }
  .bar-fill.c6 { background: linear-gradient(90deg,#8b5cf6,#a78bfa); }
  .bar-fill.c7 { background: linear-gradient(90deg,#ec4899,#f472b6); }
  .bar-fill.c8 { background: linear-gradient(90deg,#14b8a6,#2dd4bf); }
  .bar-fill.c9 { background: linear-gradient(90deg,#f97316,#fb923c); }
  .bar-fill.c10 { background: linear-gradient(90deg,#6366f1,#818cf8); }
  .bar-item-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .bar-item-balance { font-size: 13px; color: var(--ink-2); font-weight: 700; }
  .bar-item-balance strong { font-size: 16px; color: var(--ink); font-weight: 900; font-variant-numeric: tabular-nums; }
  .bar-item-badge { flex-shrink: 0; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .bar-item-badge.ok { background: var(--success-bg); color: var(--success); }
  .bar-item-badge.low { background: var(--warning-bg); color: var(--warning); }
  .bar-item-badge.out { background: var(--danger-bg); color: var(--danger); }

  .cust-item { background: var(--bg-card); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--sh-xs); border: 1.5px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cust-name { font-size: 15px; font-weight: 800; }
  .cust-qty { font-size: 14px; font-weight: 900; color: var(--accent-ink); font-variant-numeric: tabular-nums; background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; }

  .price-item { background: var(--bg-card); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--sh-xs); border: 1.5px solid var(--line-soft); }
  .price-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .price-name { font-size: 15px; font-weight: 800; }
  .price-value { font-size: 20px; font-weight: 900; color: var(--success); font-variant-numeric: tabular-nums; }
  .price-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .price-meta strong { color: var(--ink-2); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: var(--r-md); font-size: 14px; font-weight: 700; box-shadow: var(--sh-lg); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  .skeleton { background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-hover) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--r-md); }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .skeleton-item { height: 70px; margin-bottom: 8px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-3); }
  .empty-state p { font-size: 16px; font-weight: 700; }

  @media (min-width:768px) {
    .app { padding: 0 24px 80px; }
    .header { margin: 0 -24px 16px; padding: 16px 24px; }
    .kpi-grid { grid-template-columns: repeat(4,1fr); gap: 14px; }
    .kpi-value { font-size: 32px; }
    .header-text h1 { font-size: 20px; }
    .header-logo { width: 48px; height: 48px; }
    .header-logo svg { width: 26px; height: 26px; }
    .bar-track { height: 22px; }
    .tab { font-size: 15px; padding: 10px 20px; }
  }
  .footer { text-align: center; padding: 20px 16px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
  .footer strong { color: var(--ink-2); }

  @media print {
    .update-bar, .tabs, .search-box, .filters, .date-filters, .date-range, .btn-refresh, .print-btn, .theme-btn, .live-pill, .footer, .rec-history-toggle, .rec-actions-bar, #minutesModal { display: none !important; }
    body { background: #fff !important; color: #000 !important; font-size: 12px; }
    .header { position: static !important; background: transparent !important; border-bottom: 2px solid #1a2151 !important; margin: 0 0 16px 0 !important; padding: 0 0 10px 0 !important; }
    .header-actions { display: none !important; }
    .app { max-width: 100%; padding: 0; }
    .kpi-grid { grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
    .kpi-card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
    .bar-item, .cust-item, .price-item { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; margin-bottom: 8px; }
    [data-theme] { --bg: #fff; --bg-card: #fff; --ink: #000; --ink-2: #333; --line: #ccc; --line-soft: #eee; --accent-soft: #eef; }
  }

  /* Reconciliation Tab Styles */
  .rec-banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: var(--accent-soft); border: 1.5px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: var(--r-md); margin-bottom: 14px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .rec-banner-icon { color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .rec-banner-text strong { color: var(--ink); }

  .rec-history-toggle { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-card); border: 1.5px solid var(--line); color: var(--accent); font-size: 12px; font-weight: 800; cursor: pointer; padding: 4px 10px; border-radius: var(--r-sm); transition: var(--tr); font-family: inherit; }
  .rec-history-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .rec-history-toggle svg { transition: transform .2s ease; }
  .rec-history-toggle.open svg { transform: rotate(180deg); }

  .rec-table-wrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--bg-card); -webkit-overflow-scrolling: touch; }
  .rec-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: inherit; }
  .rec-table th { background: var(--bg-soft); padding: 10px 12px; font-weight: 800; color: var(--ink-2); border-bottom: 2px solid var(--line); white-space: nowrap; font-size: 12px; }
  .rec-table td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
  .rec-table tr:last-child td { border-bottom: none; }
  .rec-table tr:hover td { background: var(--bg-hover); }

  .rec-table th.col-date, .rec-table td.col-date { text-align: center; min-width: 145px; }
  .rec-table th.col-bayan, .rec-table td.col-bayan { text-align: right; min-width: 175px; padding-inline-start: 14px; }
  .rec-table th.col-diff, .rec-table td.col-diff { text-align: center; min-width: 155px; }
  .rec-table th.col-bal, .rec-table td.col-bal { text-align: center; min-width: 125px; }
  .rec-table th.col-wared, .rec-table td.col-wared { text-align: center; min-width: 130px; }
  .rec-table th.col-rate, .rec-table td.col-rate { text-align: center; min-width: 135px; }
  .rec-table th.col-user, .rec-table td.col-user { text-align: center; min-width: 110px; }

  /* Reconciliation Actions Bar */
  .rec-actions-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    margin-bottom: 14px;
    box-shadow: var(--sh-xs);
    flex-wrap: wrap;
  }
  .rec-actions-info { display: flex; flex-direction: column; gap: 2px; }
  .rec-actions-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: var(--ink); }
  .rec-actions-title svg { color: var(--accent); flex-shrink: 0; }
  .rec-actions-sub { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .rec-actions-sub strong { color: var(--accent-ink); }
  
  .rec-actions-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-primary-minutes {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--accent), var(--accent-ink));
    color: #fff;
    border: none;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;

  /* Modal Overlay */
  .modal-overlay {

    left: 0;
    right: 0;

    padding: 24px 14px;
    overflow-y: auto;

<script>
let lastData = null;
let activeTab = 'balance';
let activeFilter = 'all';
let recFilter = 'all';
let dateFilter = 'all';
let customDateStart = null;
let customDateEnd = null;
let salesSort = 'rate';
let activeChartItemName = null;
const openRecHistories = new Set();

window.toggleRecHistory = function(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const willOpen = el.style.display === 'none';
  el.style.display = willOpen ? 'block' : 'none';
  if (willOpen) {
    openRecHistories.add(id);
  } else {
    openRecHistories.delete(id);
  }
  const targetBtn = btn || document.querySelector('[data-hist-btn="' + id + '"]');
  if (targetBtn) targetBtn.classList.toggle('open', willOpen);
};

// الأصناف المستبعدة (تصنيع / عمال / نقل)
const EXCLUDED_KEYWORDS = ['تصنيع', 'عمال', 'نقل', 'مصاريف نقل', 'أجور عمال', 'أجور تصنيع', 'مصنعية', 'أجور نقل'];
function isExcluded(name, group) {
  const text = ((name||'') + ' ' + (group||'')).trim();
  for (let i = 0; i < EXCLUDED_KEYWORDS.length; i++) {
    if (text.indexOf(EXCLUDED_KEYWORDS[i]) !== -1) return true;
  }
  return false;
}
function filterExcludedItems(data) {
  if (!data) return data;
  // Filter inventory
  if (data.inventory) {
    data.inventory = data.inventory.filter(i => !isExcluded(i.name, i.group));
  }
  // Filter invoice items
  if (data.invoices && data.invoices.items) {
    data.invoices.items = data.invoices.items.filter(i => !isExcluded(i.name, ''));
  }
  // Recalculate stats after filtering
  if (data.inventory) {
    const inv = data.inventory;
    const totalBalance = inv.reduce((s, i) => s + (parseFloat(i.balance) || 0), 0);
    const lowStock = inv.filter(i => (parseFloat(i.balance) || 0) > 0 && (parseFloat(i.balance) || 0) < 50).length;
    const groups = {};
    inv.forEach(i => {
      const g = i.group || 'غير مصنف';
      if (!groups[g]) groups[g] = { count: 0, balance: 0 };
      groups[g].count++;
      groups[g].balance += (parseFloat(i.balance) || 0);
    });
    if (!data.stats) data.stats = {};
    data.stats.total_items = inv.length;
    data.stats.total_balance = Math.round(totalBalance * 1000) / 1000;
    data.stats.low_stock = lowStock;
    data.stats.groups = groups;
    if (data.invoices && data.invoices.items) {
      data.stats.total_transactions = data.invoices.items.reduce((s, i) => s + (i.invoice_count || 0), 0);
    }
  }
  return data;
}

// English number formatting
function fmt(n) {
  if(n==null||n===''||n===undefined) return '—';
  const num=parseFloat(n);
  if(isNaN(num)) return '—';
  return num.toLocaleString('en-US',{maximumFractionDigits:3});
}
function pct(n) { return n.toFixed(1)+'%'; }
function badge(b) { const n=parseFloat(b); if(isNaN(n)||n<=0) return {cls:'out',t:'نفد'}; if(n<50) return {cls:'low',t:'منخفض'}; return {cls:'ok',t:'متوفر'}; }
function colorCls(i) { return 'c'+((i%10)+1); }

// Theme toggle
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  const icon = document.getElementById('themeIcon');
  if (next === 'dark') {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}
(function() {
  const saved = localStorage.getItem('theme') || 'light';
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeIcon').innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
})();

function renderKPIs(data, tab) {
  const s = data.stats || {};
  const inv = data.inventory || [];
  const invItems = (data.invoices && data.invoices.items) ? data.invoices.items : [];
  
  const svgBox = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
  const svgCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  const svgWarn = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  const svgList = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
  const svgMoney = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
  const svgUsers = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
  const svgTrending = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';

  let cards = '';
  
  if (tab === 'balance') {
    const validInv = inv.filter(i => (parseFloat(i.balance)||0) >= 1);
    const validLow = validInv.filter(i => (parseFloat(i.balance)||0) < 50).length;
    const validTotalBal = validInv.reduce((sum, i) => sum + (parseFloat(i.balance)||0), 0);
    
    cards = '<div class="kpi-card accent"><div class="kpi-icon">'+svgBox+'</div><div class="kpi-label">إجمالي الأصناف</div><div class="kpi-value">'+validInv.length+'</div><div class="kpi-sub">صنف</div></div>' +
            '<div class="kpi-card success"><div class="kpi-icon">'+svgCheck+'</div><div class="kpi-label">إجمالي الأرصدة</div><div class="kpi-value">'+fmt(validTotalBal)+'</div><div class="kpi-sub">كيلو/وحدة</div></div>' +
            '<div class="kpi-card warning"><div class="kpi-icon">'+svgWarn+'</div><div class="kpi-label">منخفضة</div><div class="kpi-value">'+validLow+'</div><div class="kpi-sub">تحت 50 كيلو</div></div>' +
            '<div class="kpi-card info"><div class="kpi-icon">'+svgList+'</div><div class="kpi-label">إجمالي الفواتير</div><div class="kpi-value">'+fmt(s.total_transactions||0)+'</div><div class="kpi-sub">حركة</div></div>';
  } else if (tab === 'customers') {
    let custMap = {};
    invItems.forEach(item => {
      if (item.daily_customers) {
        Object.values(item.daily_customers).forEach(day => {
          Object.entries(day).forEach(([cName, qty]) => {
            custMap[cName] = (custMap[cName]||0) + qty;
          });

      } else if (item.top_customers) {
        item.top_customers.forEach(c => {
          custMap[c.name] = (custMap[c.name]||0) + c.qty;
        });
      }
    });
    const totalCusts = Object.keys(custMap).length;
    const totalRev = invItems.reduce((sum, i) => sum + (i.total_revenue||0), 0);
    const sortedGlobalCusts = Object.entries(custMap).sort((a,b)=>b[1]-a[1]);
    const topName = sortedGlobalCusts.length > 0 ? sortedGlobalCusts[0][0] : '—';
    
    cards = '<div class="kpi-card accent"><div class="kpi-icon">'+svgUsers+'</div><div class="kpi-label">عملاء نشطين</div><div class="kpi-value">'+totalCusts+'</div><div class="kpi-sub">عميل</div></div>' +

            '<div class="kpi-card info"><div class="kpi-icon">'+svgTrending+'</div><div class="kpi-label">أعلى سعر</div><div class="kpi-value">'+fmt(maxPrice)+'</div><div class="kpi-sub">جنيه</div></div>' +

  } else if (tab === 'reconciliation') {

    if (surplusFeedKg >= 1000) surplusSub += ' (' + (Math.round(surplusFeedKg / 10) / 100).toFixed(2) + ' طن)';
    if (surplusPieces > 0) surplusSub += ' | شكاير: ' + fmt(surplusPieces) + ' ق';

    cards = '<div class="kpi-card accent"><div class="kpi-icon">'+svgList+'</div><div class="kpi-label">إجمالي التسويات</div><div class="kpi-value">'+fmt(sum.total_tasweyat_count||0)+'</div><div class="kpi-sub">'+fmt(sum.total_items_with_tasweya||0)+' صنف تم جرده</div></div>' +

            '<div class="kpi-card info"><div class="kpi-icon">'+svgTrending+'</div><div class="kpi-label">متوسط العجز في الطن</div><div class="kpi-value">'+(sum.avg_kg_per_ton||0)+'</div><div class="kpi-sub">كجم / طن (للخامات والأعلاف)</div></div>';
  } else {
    // top, least, salesrate
    const soldItems = invItems.filter(i => i.total_out > 0);
    const totalOut = soldItems.reduce((sum, i) => sum + i.total_out, 0);
    const totalRev = soldItems.reduce((sum, i) => sum + i.total_revenue, 0);
    cards = '<div class="kpi-card accent"><div class="kpi-icon">'+svgBox+'</div><div class="kpi-label">أصناف مباعة</div><div class="kpi-value">'+soldItems.length+'</div><div class="kpi-sub">صنف</div></div>' +
            '<div class="kpi-card success"><div class="kpi-icon">'+svgTrending+'</div><div class="kpi-label">إجمالي المسحوبات</div><div class="kpi-value">'+fmt(totalOut)+'</div><div class="kpi-sub">كيلو</div></div>' +
            '<div class="kpi-card warning"><div class="kpi-icon">'+svgMoney+'</div><div class="kpi-label">إجمالي المبيعات</div><div class="kpi-value">'+fmt(totalRev)+'</div><div class="kpi-sub">جنيه</div></div>' +
            '<div class="kpi-card info"><div class="kpi-icon">'+svgList+'</div><div class="kpi-label">إجمالي الفواتير</div><div class="kpi-value">'+fmt(s.total_transactions||0)+'</div><div class="kpi-sub">حركة</div></div>';
  }
  
  return '<div class="kpi-grid">' + cards + '</div>';
}

function getFilterDateRange(items) {
  let latestDate = null;
  (items || []).forEach(item => {
    if (item.daily_out) {
      Object.keys(item.daily_out).forEach(d => {
        const dt = new Date(d);
        if (!isNaN(dt.getTime()) && (!latestDate || dt > latestDate)) latestDate = dt;
      });
    }
  });
  const now = new Date();
  const refDate = (latestDate && (now - latestDate > 7 * 86400000)) ? new Date(latestDate) : now;
  let startDate = null, endDate = null;
  if (dateFilter === 'today') {
    startDate = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
    endDate = new Date(startDate);
    endDate.setDate(endDate.getDate() + 1);
  } else if (dateFilter === 'week') {
    startDate = new Date(refDate);
    startDate.setDate(startDate.getDate() - 7);
    endDate = new Date(refDate);
    endDate.setDate(endDate.getDate() + 1);
  } else if (dateFilter === 'month') {
    startDate = new Date(refDate);
    startDate.setMonth(startDate.getMonth() - 1);
    endDate = new Date(refDate);
    endDate.setDate(endDate.getDate() + 1);
  } else if (dateFilter === 'custom' && customDateStart && customDateEnd) {
    startDate = new Date(customDateStart);
    endDate = new Date(customDateEnd);
    endDate.setDate(endDate.getDate() + 1);
  } else {
    startDate = new Date(refDate);
    startDate.setMonth(startDate.getMonth() - 12);
    endDate = new Date(refDate);
    endDate.setDate(endDate.getDate() + 1);
  }
  return { startDate, endDate, refDate };
}

function filterByDate(items) {
  if (dateFilter === 'all') return items;
  const { startDate, endDate } = getFilterDateRange(items);
  if (!startDate) return items;

  return items.map(item => {
    let filteredQty = 0; let filteredCount = 0;
    let custMap = {};
    if (item.daily_out) {
      Object.entries(item.daily_out).forEach(([date, qty]) => {
        try {
          const td = new Date(date);
          if (td >= startDate && (!endDate || td < endDate)) {
            filteredQty += qty;
            filteredCount++;
          }
        } catch(e) {}
      });
    }
    // Use daily_customers if available, otherwise use top_customers as fallback
    if (item.daily_customers) {
      Object.entries(item.daily_customers).forEach(([date, custs]) => {
        try {
          const td = new Date(date);
          if (td >= startDate && (!endDate || td < endDate)) {
            Object.entries(custs).forEach(([name, qty]) => {
              custMap[name] = (custMap[name]||0) + qty;
            });
          }
        } catch(e) {}
      });
    }
    // If no daily_customers data, keep original top_customers
    const topCusts = Object.keys(custMap).length > 0
      ? Object.entries(custMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,q])=>({name:n,qty:Math.round(q*1000)/1000}))
      : (item.top_customers || []);
    const allCusts = Object.keys(custMap).length > 0
      ? Object.entries(custMap).map(([n,q])=>({name:n,qty:Math.round(q*1000)/1000}))
      : null;
    const ratio = item.total_out > 0 ? filteredQty / item.total_out : 0;
    const filteredRev = item.total_revenue * ratio;
    return { ...item, total_out: Math.round(filteredQty*1000)/1000, total_revenue: Math.round(filteredRev*100)/100, invoice_count: filteredCount, top_customers: topCusts, all_customers: allCusts };
  }).filter(i => i.invoice_count > 0);
}

  let html = '<div class="date-filters">';

}

function renderCustomersTab(data) {

  // Sort items by their top customer's withdrawal amount (descending)
  filtered.sort((a,b) => {

    const bTop = (b.top_customers&&b.top_customers.length>0) ? b.top_customers[0].qty : 0;
    return bTop - aTop;
  });

  // Find max single-customer qty for bar scaling
  let maxCustQty = 1;
  filtered.forEach(item => {
    if (item.top_customers && item.top_customers.length > 0) {
      maxCustQty = Math.max(maxCustQty, item.top_customers[0].qty);
    }
  });

  // Aggregate overall top customers

  topCusts.forEach((c,i)=>{
    const logP = (Math.log(c[1]+1)/Math.log(maxAllCust+1))*100;
    const bw = Math.max(logP, 8);
    html += '<div class="cust-item"><span class="cust-name">'+(i+1)+'. '+c[0]+'</span><span class="cust-qty">'+fmt(Math.round(c[1]*1000)/1000)+'</span></div>';

  html += '<div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="searchInput" placeholder="ابحث عن صنف..." /></div>';
  html += '<div class="bar-list" id="invList">';
  let ci = 0;

    const logP = (Math.log(top.qty+1)/Math.log(maxCustQty+1))*100;

    html += '<div class="bar-item" data-name="'+(item.name||'').toLowerCase()+'">';
    html += '<div class="bar-item-header"><div><div class="bar-item-name">'+(idx+1)+'. '+item.name+'</div></div><span class="bar-item-pct">'+fmt(top.qty)+'</span></div>';
    html += '<div class="bar-track"><div class="bar-fill '+colorCls(ci++)+'" style="width:'+bw+'%"></div></div>';

    // Show top 3 customers for this item

    if (top3.length > 1) {

      top3.forEach((c, i2) => {
